name: H716 H30 maximum-edge outlier veto

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h716-private-research
  cancel-in-progress: false

jobs:
  h716-h30-max-edge-outlier-veto:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_DATA_COMMIT: bbda5f2050685f63153621a54641ebdfab943487
    steps:
      - name: Checkout strategy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned old-clean source
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ env.SOURCE_DATA_COMMIT }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research and vault dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy pytest scikit-learn
      - name: Validate H716 contract
        run: python -m pytest -q tests/test_h716_h30_max_edge_outlier_veto.py tests/test_h406_old_clean_h30_quality_prefix.py tests/test_sequential_compound_gate.py
      - name: Run H716 on pinned strict-quality old-clean source
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h716"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h716_h30_max_edge_outlier_veto.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$PRIVATE_DIR/results" \
            > "$PRIVATE_DIR/analysis-output.txt"
      - name: Seal H716 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h716" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          payload = {
              'format': 'old-clean-h716-h30-max-edge-outlier-veto-sealed-v1',
              'preregistration': {
                  'hypothesis_id': 'H716_H30_MAX_EDGE_OUTLIER_VETO',
                  'source_commit': os.environ['SOURCE_DATA_COMMIT'],
                  'rule': 'frozen H30 side/minute/fraction plus only a finite chosen-side dual-beta fee-adjusted edge cap of 0.25',
                  'robust_betas': [0.83, 1.36], 'robust_tau_seconds': 180.0,
                  'favorite_gate': False, 'price_band_gate': False, 'lower_edge_floor': False,
                  'same_ledger': True, 'required_consecutive_fills': 10,
              },
              'summary': json.loads((results / 'report.json').read_text()),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'metrics_csv': (results / 'metrics.csv').read_text(),
              'entry_diagnostics_csv': (results / 'entry_diagnostics.csv').read_text(),
              'coverage_csv': (results / 'coverage.csv').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF'], 'source_commit': os.environ['SOURCE_DATA_COMMIT']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Retain encrypted H716 delivery artifact
        if: ${{ !cancelled() && hashFiles('sealed-delivery/status.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: h716-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/part-*.vault
            sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish encrypted H716 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID" \
            --cell-id h716-h30-max-edge-outlier-veto
      - name: Public delivery summary
        if: always()
        run: |
          echo 'H716 is a paper-only, encrypted-delivery experiment; workflow success is not strategy qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'old-data-h716', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY

