name: H491 OpenMarket source synthesis

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/h491_openmarket_source_synthesis.py'
      - 'tests/test_h491_openmarket_source_synthesis.py'
      - '.github/workflows/h491-openmarket-source-synthesis.yml'

permissions:
  contents: write

jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source synthesis
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_h491_openmarket_source_synthesis.py
          mkdir -m 700 "$RUNNER_TEMP/h491"
          python -u analysis/h491_openmarket_source_synthesis.py --output "$RUNNER_TEMP/h491/report.json" > "$RUNNER_TEMP/h491/analysis-output.txt"
      - name: Seal H491 synthesis
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h491" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'h491-openmarket-source-synthesis-sealed-v1',
              'hypothesis_id': 'H491_OPENMARKET_BINANCE_LEAD_LAG_ALPHA',
              'report': json.loads((private / 'report.json').read_text()),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H491 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted completion
        if: always()
        run: |
          echo '## H491 OpenMarket source synthesis' >> "$GITHUB_STEP_SUMMARY"
          echo '- The latest public BTC/Polymarket corpus is retained as an execution/schema reference, not promoted as standalone alpha.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No new market data, model refit, live order or Canary row was created.' >> "$GITHUB_STEP_SUMMARY"

