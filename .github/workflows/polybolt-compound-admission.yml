name: polybolt-compound-admission

on:
  workflow_dispatch:
    inputs:
      strategy_profile:
        description: 'Frozen execution strategy contract to validate'
        type: choice
        options: [h530_fixed_half_cash, h30_legacy, private_exact]
        default: h530_fixed_half_cash
        required: true

permissions:
  contents: write

concurrency:
  group: polybolt-compound-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -r requirements-vault.txt pytest

      - name: Validate admission contracts
        run: |
          python -m pytest -q \
            tests/test_polybolt_twap_adapter.py \
            tests/test_validate_polybolt_compound_bundle.py \
            tests/test_run_polybolt_compound_admission.py \
            tests/test_polymarket_receipt_adapter.py \
            tests/test_polymarket_user_stream_adapter.py

      - name: Materialize private bundle only in runner temp
        env:
          POLYBOLT_COMPOUND_BUNDLE_B64: ${{ secrets.POLYBOLT_COMPOUND_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/polybolt-compound-admission"
          mkdir -m 700 "$PRIVATE_DIR"
          python - "$PRIVATE_DIR/bundle.json" <<'PY'
          import base64, os, sys
          from pathlib import Path
          value = os.environ.get('POLYBOLT_COMPOUND_BUNDLE_B64', '')
          if not value:
              print('private bundle secret unavailable; continuing with redacted fail-closed result')
          else:
              data = base64.b64decode(value, validate=True)
              if not data or len(data) > 2 * 1024 * 1024:
                  raise SystemExit('private bundle size is invalid')
              path = Path(sys.argv[1])
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
          PY

      - name: Materialize private strategy profile only in runner temp
        env:
          POLYBOLT_STRATEGY_PROFILE_JSON_B64: ${{ secrets.POLYBOLT_STRATEGY_PROFILE_JSON_B64 }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/polybolt-compound-admission"
          python - "$PRIVATE_DIR/strategy-profile.json" <<'PY'
          import base64, os, sys
          from pathlib import Path
          value = os.environ.get('POLYBOLT_STRATEGY_PROFILE_JSON_B64', '')
          if value:
              data = base64.b64decode(value, validate=True)
              if not data or len(data) > 64 * 1024:
                  raise SystemExit('private strategy profile size is invalid')
              path = Path(sys.argv[1])
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
          PY

      - name: Run v2 offline consistency checks and retain only redacted result
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/polybolt-compound-admission"
          python tools/run_polybolt_compound_admission.py \
            --bundle "$PRIVATE_DIR/bundle.json" \
            --output "$PRIVATE_DIR/result.json" \
            --strategy-profile "${{ inputs.strategy_profile || 'h530_fixed_half_cash' }}" \
            --private-strategy-config "$PRIVATE_DIR/strategy-profile.json"

      - name: Seal redacted admission result
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          STRATEGY_PROFILE: ${{ inputs.strategy_profile || 'h530_fixed_half_cash' }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/polybolt-compound-admission"
          python - "$PRIVATE_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(
              base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          result = json.loads((private / 'result.json').read_text())
          offline_passed = (
              result.get('offline_consistency_passed') is True
              and result.get('evidence_scope') == 'offline_bundle_consistency_only'
              and result.get('fills') == 10
              and result.get('consecutive') is True
              and result.get('same_ledger_identity_verified') is True
              and result.get('cash_amounts_reconciled') is True
              and result.get('source_fill_references_verified') is True
          )
          # Normalize nested and top-level status, including legacy results.
          verification = {
              'evidence_scope': 'offline_bundle_consistency_only',
              'offline_consistency_passed': offline_passed,
              # This workflow has no independent receipt-authentication path.
              # Never promote supplied flags, row counts or an exit code.
              'receipt_authenticity_verified': False,
              'gate_passed': False,
              'actual_fills': 0,
              'verified_canary_fills': 0,
          }
          payload = {
              'format': 'polybolt-compound-offline-consistency-sealed-v1',
              'result': {**result, **verification},
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF'], 'strategy_profile': os.environ.get('STRATEGY_PROFILE', 'h530_fixed_half_cash')},
              **verification,
              'offline_consistent_compounding_rows': 10 if offline_passed else 0,
              'same_ledger_compounding_rows': 0,
              'new_data_collected': False,
              'model_refit': False,
              'live_orders_enabled': False,
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          status = {'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}
          research_vault.write_new(delivery / 'status.json', research_vault.canonical(status) + b'\n', 0o644)
          PY

      - name: Publish only encrypted admission result
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Remove runner-local bundle and plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/polybolt-compound-admission" sealed-delivery
