name: H707 temporal contract audit

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source commit
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy scikit-learn pytest
      - name: Validate H707 contract without loading the corpus locally
        run: python -m pytest -q tests/test_h707_temporal_contract_audit.py
      - name: Run pinned old-clean temporal audit in the cloud
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h707"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h707_temporal_contract_audit.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "${{ inputs.source_commit }}" \
            --output "$PRIVATE_DIR/results"
          cp "$PRIVATE_DIR/results/report.json" "$PRIVATE_DIR/report.json"
      - name: Seal H707 result
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          SOURCE_DATA_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h707" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          report = json.loads((private / 'report.json').read_text())
          payload = research_vault.canonical({
              'format': 'old-clean-h707-temporal-contract-audit-sealed-v1',
              'audit': report,
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'source_commit': os.environ['SOURCE_DATA_COMMIT'],
              },
          })
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(payload, recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({
              'version': 1, 'status': 'complete', 'stage': 'sealed_delivery',
              'strategy_evaluated': False, 'live_orders_enabled': False,
              'plaintext_published': False, 'sealed_parts': 1,
          }) + b'\n', 0o644)
          PY
      - name: Publish encrypted H707 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id h707-temporal-contract-audit
      - name: Upload ciphertext and generic status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: h707-temporal-contract-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/part-0000.vault
            sealed-delivery/status.json
          if-no-files-found: error
          retention-days: 14
      - name: Redacted summary
        if: always()
        run: |
          echo '## H707 temporal contract audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- The cloud run reused the pinned old-clean source and sealed only the derived temporal-contract result.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Paper evidence, authenticated fills, settlement receipts and canary counters remain separate.' >> "$GITHUB_STEP_SUMMARY"
