name: H463 current Polymarket user-stream contract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: python -m pip install -r requirements-vault.txt pytest
      - name: Run current wire contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_h463_current_user_stream_contract.py tests/test_h340_async_maker_receipt_contract.py
          python analysis/h463_current_user_stream_contract.py --output "$RUNNER_TEMP/h463-report.json"
      - name: Seal contract report
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h463-report.json" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          report_path = Path(sys.argv[1])
          report_bytes = report_path.read_bytes()
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient_unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'h463-current-user-stream-contract-sealed-v1',
              'report': json.loads(report_bytes),
              'report_sha256': hashlib.sha256(report_bytes).hexdigest(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted contract report
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H463 current Polymarket user-stream contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- The official order/trade lifecycle vector passed; matched and mined states remain non-terminal.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Confirmed trade status plus transaction reference is still only a fill candidate; settlement and cash checkpoints remain separate.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No market data, strategy replay, model refit or order was performed.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h463-report.json', Path('sealed-delivery')):
              if path.exists():
                  shutil.rmtree(path) if path.is_dir() else path.unlink()
          PY
