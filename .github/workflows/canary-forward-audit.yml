name: canary-forward-audit
on:
  pull_request:
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', 'analysis/public_outcome_audit.py', 'tests/test_public_outcome_audit.py', 'tests/test_event_evidence.py', 'tests/test_canary*.py', '.github/workflows/canary-forward-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', 'analysis/public_outcome_audit.py', '.github/workflows/canary-forward-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: canary-readonly-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing read-only regression tests
        run: python -m unittest discover -s tests -p 'test_canary*.py' -v
      - name: Event evidence safety and integrity tests
        run: python -m unittest discover -s tests -p 'test_event_evidence.py' -v
      - name: Public final outcome identity and timestamp tests
        run: python -m unittest discover -s tests -p 'test_public_outcome_audit.py' -v
      - name: Acquire bounded recent public snapshots and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u analysis/forward_acquire.py --output forward_inputs --max-releases 16 --max-bytes 268435456
      - name: Verify bounded archive coverage and record deployment scope
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          m = json.loads(Path('forward_inputs/acquisition_manifest.json').read_text(encoding='utf-8'))
          expected = sum(r['eligible_snapshot_label_archives'] for r in m.get('releases', []))
          downloaded = len(m.get('files', []))
          skipped = m.get('skipped', [])
          errors = m.get('errors', [])
          accounted = downloaded + len(skipped) + len(errors)
          max_bytes = int(m.get('max_bytes') or 0)
          downloaded_bytes = int(m.get('downloaded_bytes') or 0)
          status = {
              'scope': 'public archive acquisition and checksum validation only',
              'source_repository': m.get('source_repository'),
              'selected_release_count': len(m.get('releases', [])),
              'listed_archive_count': expected,
              'downloaded_files': downloaded,
              'downloaded_bytes': downloaded_bytes,
              'max_bytes': max_bytes,
              'budget_exhausted': bool(m.get('budget_exhausted')),
              'budget_skipped_files': len(skipped),
              'errors': errors,
              'listed_assets_accounted_for': expected > 0 and expected == accounted,
              'listed_files_complete': expected > 0 and expected == downloaded and not skipped and not errors,
              'bounded_acquisition_complete': (
                  downloaded > 0
                  and expected > 0
                  and expected == accounted
                  and downloaded_bytes <= max_bytes
                  and not errors
              ),
              'full_history_complete': False,
              'new_blocked_strategy_modules_deployed': False,
              'live_trading_enabled': False,
              'note': 'No strategy evaluation or order submission in this workflow. '
                      'Snapshots and labels are intentionally bounded to up to 16 recent releases and 256 MiB. '
                      'Eligible files that do not fit the byte cap are explicit budget skips, not integrity errors. '
                      'A separate raw-message sample has a two-file/32 MiB limit and its own manifest; neither certifies a complete tape.'
          }
          Path('forward_inputs/deployment_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Read-only bounded acquisition deployment\n\n```json\n'
                      + json.dumps(status, ensure_ascii=False, indent=2) + '\n```\n')
          if not status['bounded_acquisition_complete']:
              raise SystemExit('Bounded acquisition integrity failure: inspect acquisition_manifest.json; not a green data run.')
          PY
      - name: Acquire two checksum-verified public raw segments, at most 32 MiB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u analysis/acquire_event_evidence.py --manifest forward_inputs/acquisition_manifest.json --output forward_inputs/event_evidence
      - name: Backfill public final outcomes with actual retrieval timestamps
        run: python -u analysis/public_outcome_audit.py --output forward_inputs/outcome_evidence --hours 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forward_inputs/
            analysis/forward_acquire.py
            analysis/acquire_event_evidence.py
            analysis/public_outcome_audit.py
            analysis/canary*.py
            tests/test_canary*.py
            tests/test_event_evidence.py
            tests/test_public_outcome_audit.py
            config/canary*.json
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
