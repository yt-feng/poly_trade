name: canary-forward-audit
on:
  pull_request:
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', 'tests/test_event_evidence.py', 'tests/test_canary*.py', '.github/workflows/canary-forward-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', '.github/workflows/canary-forward-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: canary-readonly-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing read-only regression tests
        run: python -m unittest discover -s tests -p 'test_canary*.py' -v
      - name: Event evidence safety and integrity tests
        run: python -m unittest discover -s tests -p 'test_event_evidence.py' -v
      - name: Acquire bounded recent public snapshots and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u analysis/forward_acquire.py --output forward_inputs --max-releases 16 --max-bytes 268435456
      - name: Verify listed archive coverage and record deployment scope
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          m = json.loads(Path('forward_inputs/acquisition_manifest.json').read_text(encoding='utf-8'))
          expected = sum(r['eligible_snapshot_label_archives'] for r in m.get('releases', []))
          status = {
              'scope': 'public archive acquisition and checksum validation only',
              'source_repository': m.get('source_repository'),
              'selected_release_count': len(m.get('releases', [])),
              'listed_archive_count': expected,
              'downloaded_files': len(m.get('files', [])),
              'downloaded_bytes': m.get('downloaded_bytes'),
              'errors': m.get('errors', []),
              'listed_files_complete': expected > 0 and expected == len(m.get('files', [])) and not m.get('errors'),
              'full_history_complete': False,
              'new_blocked_strategy_modules_deployed': False,
              'live_trading_enabled': False,
              'note': 'No strategy evaluation or order submission in this workflow. '
                      'Snapshots and labels are limited to listed assets of up to 16 recent releases and 256 MiB. '
                      'A separate raw-message sample has a two-file/32 MiB limit and its own manifest; neither certifies a complete tape.'
          }
          Path('forward_inputs/deployment_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Read-only acquisition deployment\n\n```json\n'
                      + json.dumps(status, ensure_ascii=False, indent=2) + '\n```\n')
          if not status['listed_files_complete']:
              raise SystemExit('Incomplete acquisition: inspect acquisition_manifest.json; not a green data run.')
          PY
      - name: Acquire two checksum-verified public raw segments, at most 32 MiB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u analysis/acquire_event_evidence.py --manifest forward_inputs/acquisition_manifest.json --output forward_inputs/event_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forward_inputs/
            analysis/forward_acquire.py
            analysis/acquire_event_evidence.py
            analysis/canary*.py
            tests/test_canary*.py
            tests/test_event_evidence.py
            config/canary*.json
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
