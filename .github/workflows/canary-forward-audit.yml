name: canary-forward-audit
on:
  pull_request:
    paths: ['analysis/forward_acquire.py', 'tests/test_canary*.py', '.github/workflows/canary-forward-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/forward_acquire.py', '.github/workflows/canary-forward-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: canary-readonly-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing read-only regression tests
        run: python -m unittest discover -s tests -p 'test_canary*.py' -v
      - name: Acquire bounded recent public snapshots and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE="$(date -u -d '2 days ago' +%F)"
          echo "Acquisition release-date lower bound (UTC): ${SINCE}"
          python -u analysis/forward_acquire.py --output forward_inputs --since "$SINCE"
      - name: Verify acquisition completeness and record deployment scope
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('forward_inputs/acquisition.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          status = {
              'scope': 'public archive acquisition and checksum validation only',
              'source_repository': m.get('source_repository'),
              'inventory_complete': bool(m.get('complete_this_inventory')),
              'downloaded_files': len(m.get('files', [])),
              'downloaded_bytes': m.get('downloaded_bytes'),
              'errors': m.get('errors', []),
              'new_forward_strategy_modules_deployed': False,
              'live_trading_enabled': False,
              'note': 'No strategy evaluation or order submission in this workflow. '
                      'This is a bounded recent-release download, not lifetime data completeness.'
          }
          Path('forward_inputs/deployment_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('# Read-only acquisition deployment\n\n```json\n'
                      + json.dumps(status, ensure_ascii=False, indent=2) + '\n```\n')
          if not status['inventory_complete'] or not status['downloaded_files']:
              raise SystemExit('Incomplete acquisition: inspect acquisition.json; not a green data run.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forward_inputs/
            analysis/forward_acquire.py
            analysis/canary*.py
            tests/test_canary*.py
            config/canary*.json
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
