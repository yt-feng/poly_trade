name: canary-forward-audit
on:
  pull_request:
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', 'analysis/public_outcome_audit.py', 'tests/test_forward_acquisition_recovery.py', 'tests/test_public_outcome_audit.py', 'tests/test_event_evidence.py', 'tests/test_canary*.py', '.github/workflows/canary-forward-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/forward_acquire.py', 'analysis/acquire_event_evidence.py', 'analysis/public_outcome_audit.py', 'tests/test_forward_acquisition_recovery.py', '.github/workflows/canary-forward-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: canary-readonly-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression and failure-recovery contracts
        id: regression
        run: |
          python -m unittest discover -s tests -p 'test_canary*.py' -v
          python -m unittest discover -s tests -p 'test_forward_acquisition_recovery.py' -v
          python -m unittest discover -s tests -p 'test_event_evidence.py' -v
          python -m unittest discover -s tests -p 'test_public_outcome_audit.py' -v
      - name: Acquire fixed selection with one bounded recovery pass
        id: acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u analysis/forward_acquire.py --output forward_inputs --max-releases 16 --max-bytes 268435456 --recover-once
      - name: Verify bounded archive coverage and record scope
        if: ${{ !cancelled() && steps.regression.outcome == 'success' }}
        id: integrity
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'analysis')
          from forward_acquire import validate_manifest, save_json
          p=Path('forward_inputs/acquisition_manifest.json')
          m=json.loads(p.read_text()) if p.exists() else {}
          ok=validate_manifest(m)
          # Expose only typed transport metadata, never exception text, URLs,
          # headers, bodies, filenames or credentials. Do not alter recovery.
          def bounded_int(value, low, high):
              return value if type(value) is int and low <= value <= high else None
          def known_bool(value):
              return value if type(value) is bool else None
          errors=m.get('errors', [])
          phase=('selection_plan' if m.get('selection_complete') is False
                 else 'archive_transfer' if m.get('selection_complete') is True
                 else 'unknown')
          public_failures=[]
          for error in errors[:20]:
              error=error if isinstance(error, dict) else {}
              public_failures.append({'phase':phase,
                  'http_status':bounded_int(error.get('http_status'),100,599),
                  'attempts':bounded_int(error.get('attempts'),1,100),
                  'retryable':known_bool(error.get('retryable')),
                  'access_refused':known_bool(error.get('access_refused'))})
          state={'scope':'bounded_public_archive_integrity_only',
            'bounded_acquisition_complete':ok,
            'downloaded_files':len(m.get('files',[])),
            'unresolved_error_count':len(errors),
            'recovered_failure_count':len(m.get('failure_history',[])),
            'budget_skips':len(m.get('skipped',[])),
            'acquisition_halted':m.get('acquisition_halted',True),
            'full_history_complete':False, 'strategy_evaluated':False, 'live_trading_enabled':False,
            'status_contract_version':2, 'source_manifest_present':p.is_file(),
            'selection_complete':known_bool(m.get('selection_complete')),
            'public_failures':public_failures,
            'failure_details_omitted':max(0,len(errors)-len(public_failures))}
          save_json(Path('forward_inputs/deployment_status.json'),state)
          print(json.dumps(state,indent=2))
          if not ok:raise SystemExit('Public archive integrity not satisfied; retained evidence is partial.')
          PY
      - name: Independent raw sample after archive transport errors
        if: ${{ !cancelled() && steps.regression.outcome == 'success' }}
        id: raw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p=Path('forward_inputs/acquisition_manifest.json')
          m=json.loads(p.read_text()) if p.exists() else {}
          if not m.get('releases') or m.get('acquisition_halted',False):
              raise SystemExit('No safe release identity available for raw sample; collection withheld.')
          PY
          python -u analysis/acquire_event_evidence.py --manifest forward_inputs/acquisition_manifest.json --output forward_inputs/event_evidence
      - name: Independent public outcome backfill
        if: ${{ !cancelled() && steps.regression.outcome == 'success' }}
        id: outcomes
        run: python -u analysis/public_outcome_audit.py --output forward_inputs/outcome_evidence --hours 48
      - name: Save available public evidence even when a component fails
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.regression.outcome == 'success' }}
        with:
          name: canary-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forward_inputs/
            analysis/forward_acquire.py
            analysis/acquire_event_evidence.py
            analysis/public_outcome_audit.py
            analysis/canary*.py
            tests/test_canary*.py
            tests/test_forward_acquisition_recovery.py
            tests/test_event_evidence.py
            tests/test_public_outcome_audit.py
            config/canary*.json
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
