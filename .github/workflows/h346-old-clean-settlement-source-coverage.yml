name: H346 old-clean settlement source coverage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h346-old-clean-settlement-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_DATA_COMMIT: bbda5f2050685f63153621a54641ebdfab943487
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen clean-data source
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: bbda5f2050685f63153621a54641ebdfab943487
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vault dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Validate H346
        run: python -m pytest -q tests/test_h346_old_clean_settlement_source_coverage.py && python -m py_compile analysis/h346_old_clean_settlement_source_coverage.py
      - name: Run H346 on pinned old-clean source
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h346"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h346_old_clean_settlement_source_coverage.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$PRIVATE_DIR/results" \
            > "$PRIVATE_DIR/analysis-output.txt"
      - name: Seal H346 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h346" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          payload = {
              'format': 'old-clean-h346-settlement-source-coverage-sealed-v1',
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'report': json.loads((results / 'report.json').read_text()),
              'metrics_csv': (results / 'metrics.csv').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF'], 'source_commit': os.environ['SOURCE_DATA_COMMIT']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H346 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          for path in (Path(os.environ['RUNNER_TEMP']) / 'old-data-h346', Path('sealed-delivery')):
              if path.exists():
                  shutil.rmtree(path)
          PY
