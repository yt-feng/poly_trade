name: cash-receipt-audit
on:
  pull_request:
    paths: ['analysis/cash_amount_audit.py', 'analysis/canary_receipt_amount_state.py', 'tests/test_cash_amount_audit.py', '.github/workflows/cash-receipt-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/cash_amount_audit.py', 'analysis/canary_receipt_amount_state.py', 'tests/test_cash_amount_audit.py', '.github/workflows/cash-receipt-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic receipt amount and legacy-regression tests, no account access
        run: |
          python -m unittest discover -s tests -p 'test_cash_amount_audit.py' -v
          python -m unittest discover -s tests -p 'test_receipt_source_audit.py' -v
          python -m unittest discover -s tests -p 'test_canary_execution_plan.py' -v
      - name: Compile read-only additions
        run: python -m py_compile analysis/cash_amount_audit.py analysis/canary_receipt_amount_state.py
