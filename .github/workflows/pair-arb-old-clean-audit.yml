name: pair-arb-old-clean-audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: bbda5f2050685f63153621a54641ebdfab943487

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded audit dependencies
        run: python -m pip install -r requirements-vault.txt pandas numpy

      - name: Run frozen taker and idealized pair scenarios
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/pair-arb-old-clean"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/pair_arb_old_data.py \
            --source-root source_poly/data/monthly_runs \
            --output "$PRIVATE_DIR/taker" \
            --fee-rate 0.07 --slippage 0.0025 --cash-release-delay-seconds 600
          python -u analysis/pair_arb_old_data.py \
            --source-root source_poly/data/monthly_runs \
            --output "$PRIVATE_DIR/idealized" \
            --fee-rate 0 --slippage 0 --cash-release-delay-seconds 600

      - name: Seal only the scenario summaries
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/pair-arb-old-clean"
          python - "$PRIVATE_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'old-clean-complete-set-pair-capital-bound-sealed-v2',
              'source_commit': 'bbda5f2050685f63153621a54641ebdfab943487',
              'taker_summary': json.loads((private / 'taker/summary.json').read_text()),
              'taker_splits': json.loads((private / 'taker/split_summary.json').read_text()),
              'idealized_summary': json.loads((private / 'idealized/summary.json').read_text()),
              'idealized_splits': json.loads((private / 'idealized/split_summary.json').read_text()),
              'protocol': {'initial_cash': 10, 'minimum_order_usdc_per_leg': 5,
                           'cash_release_delay_seconds': 600, 'required_consecutive_fills': 10,
                           'live_orders_enabled': False, 'actual_fills': 0,
                           'verified_canary_fills': 0},
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'],
                           'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                           'ref': os.environ['GITHUB_REF']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(
              delivery / 'part-0000.vault',
              research_vault.seal(research_vault.canonical(payload), recipient, recipient_id),
              0o600,
          )
          research_vault.write_new(
              delivery / 'status.json',
              research_vault.canonical({'version': 1, 'status': 'complete',
                  'stage': 'sealed_delivery', 'strategy_evaluated': False,
                  'live_orders_enabled': False, 'plaintext_published': False,
                  'sealed_parts': 1}) + b'\n',
              0o644,
          )
          PY

      - name: Publish only encrypted research delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Remove runner-local plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/pair-arb-old-clean" sealed-delivery
