name: H508 H301 paper forward adapter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout strategy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate adapter contract
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -r requirements-vault.txt pytest
          python -m pytest -q tests/test_h508_h301_forward_adapter.py tests/test_causal_cash_ledger.py
      - name: Decode the registered private forward bundle
        env:
          H508_H301_FORWARD_INPUT_B64: ${{ secrets.H508_H301_FORWARD_INPUT_B64 }}
        run: |
          set -euo pipefail
          test -n "${H508_H301_FORWARD_INPUT_B64:-}" || { echo 'FORWARD_INPUT_MISSING' >&2; exit 78; }
          private_dir="$RUNNER_TEMP/h508-h301-forward"
          mkdir -m 700 "$private_dir"
          printf '%s' "$H508_H301_FORWARD_INPUT_B64" | base64 --decode > "$private_dir/input.json"
          test "$(wc -c < "$private_dir/input.json")" -le 209715200
          unset H508_H301_FORWARD_INPUT_B64
      - name: Run the two preregistered paper policies
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h508-h301-forward"
          python -u analysis/h508_h301_forward_adapter.py \
            --input "$private_dir/input.json" \
            --output "$private_dir/result.json" \
            > "$private_dir/analysis-output.txt"
      - name: Seal result with verified recipient
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h508-h301-forward"
          python - "$private_dir" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient_unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          result = json.loads((private / 'result.json').read_text())
          payload = {
              'format': 'btc5m-h508-h301-forward-adapter-sealed-v1',
              'hypothesis_id': result['hypothesis_id'],
              'result': result,
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'ref': os.environ['GITHUB_REF'],
              },
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(
              delivery / 'part-0000.vault',
              research_vault.seal(research_vault.canonical(payload), recipient, recipient_id),
              0o600,
          )
          research_vault.write_new(
              delivery / 'status.json',
              research_vault.canonical({
                  'version': 1,
                  'status': 'complete',
                  'stage': 'sealed_delivery',
                  'strategy_evaluated': True,
                  'live_orders_enabled': False,
                  'plaintext_published': False,
                  'sealed_parts': 1,
              }) + b'\n',
              0o644,
          )
          PY
      - name: Publish encrypted result
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H508 H301 paper forward adapter' >> "$GITHUB_STEP_SUMMARY"
          echo '- The fixed 0.50 and 0.75 cash fractions are evaluated with the supplied depth, fee, latency and paper fill-admission contract.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Detailed metrics remain encrypted; this workflow never submits orders and never counts paper rows as canary fills.' >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/h508-h301-forward" sealed-delivery
