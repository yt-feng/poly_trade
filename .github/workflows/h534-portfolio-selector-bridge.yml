name: H534 portfolio selector bridge

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source commit
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cloud research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-vault.txt pandas numpy scikit-learn pytest
      - name: Validate bridge contract
        run: PYTHONPATH=. python -m pytest -q tests/test_h534_portfolio_selector_bridge.py tests/test_h534_dense_cash_fraction_grid.py tests/test_h508_cash_fraction_depth_tradeoff.py tests/test_sequential_compound_gate.py
      - name: Run frozen H534 versus selector bridge in cloud
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/h534-portfolio-selector-bridge"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h534_portfolio_selector_bridge.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_COMMIT" \
            --output "$PRIVATE_DIR/results" > "$PRIVATE_DIR/analysis-output.txt"
      - name: Seal encrypted bridge result
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h534-portfolio-selector-bridge" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          payload = {
              'format': 'old-clean-h534-portfolio-selector-bridge-sealed-v1',
              'hypothesis_id': 'H534_PORTFOLIO_SELECTOR_BRIDGE',
              'summary': json.loads((results / 'report.json').read_text()),
              'portfolio_metrics_csv': (results / 'portfolio_metrics.csv').read_text(),
              'coverage_csv': (results / 'coverage.csv').read_text(),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF'], 'source_commit': os.environ['SOURCE_COMMIT']},
          }
          delivery = Path('sealed-delivery'); delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish only encrypted bridge journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id h534-portfolio-selector-bridge
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H534 portfolio selector bridge' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen H534 0.55 and portfolio_conservative_v2 were compared on the same old-clean source and one evolving paper ledger.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Detailed metrics are encrypted; no live orders, account access, or Canary credit.' >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/h534-portfolio-selector-bridge" sealed-delivery
