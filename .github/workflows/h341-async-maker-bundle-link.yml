name: H341 async maker bundle link

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h341-async-maker-bundle-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt pytest
      - name: Validate async maker contract
        run: python -m pytest -q tests/test_h341_async_maker_bundle_link.py tests/test_h340_async_maker_receipt_contract.py tests/test_maker_compound_bundle_adapter.py
      - name: Produce private report
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python analysis/h341_async_maker_bundle_link.py > "$RUNNER_TEMP/h341-report.json"
      - name: Seal report
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h341-report.json" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault

          report_path = Path(sys.argv[1])
          report_bytes = report_path.read_bytes()
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          report = json.loads(report_bytes)
          payload = {
              'format': 'h341-async-maker-bundle-link-sealed-v1',
              'report': report,
              'report_sha256': hashlib.sha256(report_bytes).hexdigest(),
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'ref': os.environ['GITHUB_REF'],
                  'head_sha': os.environ['GITHUB_SHA'],
              },
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(
              delivery / 'part-0000.vault',
              research_vault.seal(research_vault.canonical(payload), recipient, recipient_id),
              0o600,
          )
          status = {
              'version': 1,
              'status': 'complete',
              'stage': 'sealed_delivery',
              'strategy_evaluated': False,
              'live_orders_enabled': False,
              'plaintext_published': False,
              'sealed_parts': 1,
          }
          research_vault.write_new(
              delivery / 'status.json',
              research_vault.canonical(status) + b'\n',
              0o644,
          )
          PY
      - name: Publish encrypted journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Remove runner-local report
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/h341-report.json"
          rm -rf sealed-delivery
