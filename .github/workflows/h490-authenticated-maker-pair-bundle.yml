name: H490 authenticated maker pair bundle contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/validate_authenticated_maker_pair_bundle.py'
      - 'analysis/h490_authenticated_maker_pair_bundle.py'
      - 'tests/test_validate_authenticated_maker_pair_bundle.py'
      - 'tests/test_h490_authenticated_maker_pair_bundle.py'
      - '.github/workflows/h490-authenticated-maker-pair-bundle.yml'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: python -m pip install pytest cryptography
      - name: Run H490 contract audit
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_validate_authenticated_maker_pair_bundle.py tests/test_h490_authenticated_maker_pair_bundle.py
          mkdir -m 700 "$RUNNER_TEMP/h490"
          python -u analysis/h490_authenticated_maker_pair_bundle.py --output "$RUNNER_TEMP/h490/report.json" > "$RUNNER_TEMP/h490/analysis-output.txt"
      - name: Seal H490 audit
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h490" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'h490-authenticated-maker-pair-bundle-sealed-v1',
              'hypothesis_id': 'H490_AUTHENTICATED_TWO_LEG_MAKER_BUNDLE_CONTRACT',
              'report': json.loads((private / 'report.json').read_text()),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H490 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted completion
        if: always()
        run: |
          echo '## H490 authenticated maker pair bundle contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ten chronological paired maker events now require both legs, lifecycle evidence, receipt identity and one evolving cash ledger.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Synthetic consistency remains offline-only; actual and verified Canary counts remain zero.' >> "$GITHUB_STEP_SUMMARY"

