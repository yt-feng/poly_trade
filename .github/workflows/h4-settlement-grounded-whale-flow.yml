name: H4 settlement-grounded whale-flow contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: H4 settlement-grounded whale-flow contract tests
        run: python -m pytest -q tests/test_h4_settlement_grounded_whale_flow.py tests/test_sequential_compound_gate.py
      - name: Compile H4 validator
        run: python -m py_compile analysis/h4_settlement_grounded_whale_flow.py analysis/authenticated_compound_reconciler.py
