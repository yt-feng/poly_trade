name: H534 strict fixed 055 chain audit

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source commit
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy scikit-learn pytest
      - name: Validate strict chain contract
        run: PYTHONPATH=analysis python -m pytest -q tests/test_h534_strict_chain_audit.py tests/test_h534_dense_cash_fraction_grid.py tests/test_h508_cash_fraction_depth_tradeoff.py
      - name: Run parent H534 and strict fixed-fraction audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h534r"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h534_dense_cash_fraction_grid.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "${{ inputs.source_commit }}" \
            --output "$PRIVATE_DIR/results" > "$PRIVATE_DIR/h534-output.txt"
          PYTHONPATH=analysis python -u analysis/h534_strict_chain_audit.py \
            --summary "$PRIVATE_DIR/results/summary.json" \
            --source-commit "${{ inputs.source_commit }}" \
            --output "$PRIVATE_DIR/strict-chain-audit.json" > "$PRIVATE_DIR/audit-output.txt"
      - name: Seal strict audit result
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          SOURCE_DATA_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h534r" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          audit = json.loads((private / 'strict-chain-audit.json').read_text())
          payload = research_vault.canonical({
              'format': 'old-clean-h534-strict-chain-audit-sealed-v1',
              'audit': audit,
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'source_commit': os.environ['SOURCE_DATA_COMMIT'],
              },
          })
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(payload, recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({
              'version': 1, 'status': 'complete', 'stage': 'sealed_delivery',
              'strategy_evaluated': True, 'live_orders_enabled': False,
              'plaintext_published': False, 'sealed_parts': 1,
          }) + b'\n', 0o644)
          PY
      - name: Publish encrypted strict audit journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id h534-strict-chain-audit
      - name: Upload ciphertext and generic status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: h534-strict-chain-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/part-0000.vault
            sealed-delivery/status.json
          if-no-files-found: error
          retention-days: 14
      - name: Redacted summary
        if: always()
        run: |
          echo '## H534 strict chain audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- The cloud run reused the pinned old-clean source and sealed only the derived strict-chain result.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Paper evidence, authenticated fills, settlement receipts and canary counters remain separate.' >> "$GITHUB_STEP_SUMMARY"
