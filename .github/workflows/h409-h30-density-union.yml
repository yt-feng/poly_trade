name: H409 H30 density union

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h409-h30-density-union:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_DATA_COMMIT: bbda5f2050685f63153621a54641ebdfab943487
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen clean-data source
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: bbda5f2050685f63153621a54641ebdfab943487
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research and vault dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy pytest scikit-learn
      - name: Validate H409 contract
        run: python -m pytest -q tests/test_h409_h30_density_union.py tests/test_h406_old_clean_h30_quality_prefix.py tests/test_sequential_compound_gate.py
      - name: Run H409 on pinned strict-quality old-clean source
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h409"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h409_h30_density_union.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$PRIVATE_DIR/results" \
            > "$PRIVATE_DIR/analysis-output.txt"
      - name: Seal H409 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h409" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          payload = {
              'format': 'old-clean-h409-h30-density-union-sealed-v1',
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'summary': json.loads((results / 'report.json').read_text()),
              'metrics_csv': (results / 'metrics.csv').read_text(),
              'entry_diagnostics_csv': (results / 'entry_diagnostics.csv').read_text(),
              'coverage_csv': (results / 'coverage.csv').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF'], 'source_commit': os.environ['SOURCE_DATA_COMMIT']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H409 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          for path in (Path(os.environ['RUNNER_TEMP']) / 'old-data-h409', Path('sealed-delivery')):
              if path.exists():
                  shutil.rmtree(path)
          PY
