name: H389 pair-cost per-order contract gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: JREREEE/btc-5m-market-trading-bot
      SOURCE_COMMIT: 56484ca7e5fe15e0a573ee0c232d2281e56a35e0
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vault dependencies
        run: |
          python -m pip install -r requirements-vault.txt
          python -m pip install pytest
      - name: Validate contract gate
        run: python -m pytest -q tests/test_h389_pair_cost_contract_gate.py
      - name: Run pinned online contract replay
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${SOURCE_REPOSITORY}.git" "$RUNNER_TEMP/h389-source" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/h389-source" checkout --quiet "$SOURCE_COMMIT"
          python analysis/h389_pair_cost_contract_gate.py \
            --input "$RUNNER_TEMP/h389-source/results/target/target_activity.json" \
            --output "$RUNNER_TEMP/h389-report.json" \
            --source-commit "$SOURCE_COMMIT"
      - name: Seal report
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h389-report.json" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          report_path = Path(sys.argv[1])
          report_bytes = report_path.read_bytes()
          report = json.loads(report_bytes)
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {'format': 'h389-pair-cost-contract-gate-sealed-v1', 'report': report, 'report_sha256': hashlib.sha256(report_bytes).hexdigest(), 'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']}}
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          status = {'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}
          research_vault.write_new(delivery / 'status.json', research_vault.canonical(status) + b'\n', 0o644)
          PY
      - name: Publish encrypted journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Remove runner-local evidence
        if: always()
        run: rm -rf sealed-delivery "$RUNNER_TEMP/h389-report.json" "$RUNNER_TEMP/h389-source"
