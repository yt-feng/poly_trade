name: H414 expanded HF maker replay

on:
  workflow_dispatch:
    inputs:
      window_count:
        description: "One contiguous five-minute window count (fixed protocol; 24 recommended)"
        required: true
        default: "24"
      start_offset:
        description: "Offset in five-minute windows from the pinned day start"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATASET_REVISION: f3bfb79f19611ea3115ad29c18720166ee6dd0b5
      DATASET_BASE: https://huggingface.co/datasets/krish301/polymarket-crypto-trades-v1/resolve/f3bfb79f19611ea3115ad29c18720166ee6dd0b5/data/raw/trades/btc/5m/05-03-2026
      SOURCE_REPOSITORY: 0xbrutusdev/polymarket-5min-crypto-trading-bot
      SOURCE_COMMIT: accd1511a08748302c8116ab65575930e1240068
      WINDOW_START: 1772668800
      QUEUE_VALUES: 0,5,10
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install replay dependencies
        run: python -m pip install -r requirements-vault.txt
      - name: Checkout pinned source engine
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${SOURCE_REPOSITORY}.git" "$RUNNER_TEMP/h414-source" >/dev/null 2>&1
          git -C "$RUNNER_TEMP/h414-source" checkout --quiet "$SOURCE_COMMIT"
          python -m pip install -r "$RUNNER_TEMP/h414-source/requirements.txt" >/dev/null 2>&1
      - name: Download one contiguous bounded tape
        env:
          INPUT_WINDOW_COUNT: ${{ inputs.window_count }}
          INPUT_START_OFFSET: ${{ inputs.start_offset }}
        run: |
          set -euo pipefail
          case "$INPUT_WINDOW_COUNT" in (24) ;; (*) echo 'window_count must remain the pre-registered 24' >&2; exit 2 ;; esac
          case "$INPUT_START_OFFSET" in (0) ;; (*) echo 'start_offset must remain the pre-registered 0' >&2; exit 2 ;; esac
          private_dir="$RUNNER_TEMP/h414"
          mkdir -m 700 -p "$private_dir/fills" "$private_dir/labels"
          for ((index=0; index<INPUT_WINDOW_COUNT; index++)); do
            start=$((WINDOW_START + 300 * (INPUT_START_OFFSET + index)))
            folder=$(date -u -d "@$start" +%H-%M-00-UTC)
            curl --fail --location --retry 3 --max-time 180 \
              "$DATASET_BASE/$folder/fills.jsonl.gz?download=true" \
              --output "$private_dir/fills/${start}.fills.jsonl.gz"
            curl --fail --location --retry 3 --max-time 60 \
              "https://gamma-api.polymarket.com/events?slug=btc-updown-5m-${start}" \
              --output "$private_dir/labels/${start}.json"
          done
      - name: Validate and run fixed maker replay
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h414"
          python -m pytest -q tests/test_h391_hf_maker_replay.py tests/test_h387_maker_replay.py tests/test_sequential_compound_gate.py tests/test_h414_expanded_hf_maker_replay_workflow.py
          python -u analysis/h391_hf_maker_replay.py \
            --source-root "$RUNNER_TEMP/h414-source" \
            --fills-dir "$private_dir/fills" \
            --labels-dir "$private_dir/labels" \
            --output "$private_dir/backtest.json" \
            --source-commit "$SOURCE_COMMIT" \
            --dataset-revision "$DATASET_REVISION" \
            --queue "$QUEUE_VALUES"
          python -u analysis/h387_maker_replay.py \
            --input "$private_dir/backtest.json" \
            --output "$private_dir/report.json" \
            --source-commit "$SOURCE_COMMIT"
      - name: Seal H414 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h414" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          backtest = (private / 'backtest.json').read_bytes()
          report = (private / 'report.json').read_bytes()
          payload = {
              'format': 'h414-expanded-hf-maker-replay-sealed-v1',
              'backtest': json.loads(backtest),
              'report': json.loads(report),
              'hashes': {'backtest_sha256': hashlib.sha256(backtest).hexdigest(), 'report_sha256': hashlib.sha256(report).hexdigest()},
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA'], 'dataset_revision': os.environ['DATASET_REVISION'], 'source_commit': os.environ['SOURCE_COMMIT'], 'window_count': 24, 'start_offset': 0},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          status = {'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}
          research_vault.write_new(delivery / 'status.json', research_vault.canonical(status) + b'\n', 0o644)
          PY
      - name: Publish encrypted H414 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted completion and cleanup
        if: always()
        run: |
          echo '## H414 expanded HF maker replay' >> "$GITHUB_STEP_SUMMARY"
          echo '- One pre-registered contiguous 24-window public OrderFilled tape was replayed through the fixed $5 paired maker protocol.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The same $10 ledger, no-reset, no-concatenation gate remains paper-only; no order, redemption, or Canary row is published.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h414', Path(os.environ['RUNNER_TEMP']) / 'h414-source', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
