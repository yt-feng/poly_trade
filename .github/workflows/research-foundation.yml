name: research-foundation

on:
  pull_request:
    paths:
      - 'research/**'
      - 'reports/canary_readiness_foundation/**'
      - 'evidence/ledger/**'
      - 'analysis/canary_evidence_ledger.py'
      - 'analysis/archive_baseline_audit.py'
      - 'analysis/v3_data_contract.py'
      - 'analysis/walk_forward_intake.py'
      - 'analysis/walk_forward_split_audit.py'
      - 'analysis/preregistered_strategy.py'
      - 'analysis/research_manifest_contracts.py'
      - 'analysis/execution_realism_contract.py'
      - 'analysis/walk_forward_execution.py'
      - 'analysis/public_acquisition_dry_run.py'
      - 'research/strategy/schema/**'
      - 'docs/walk_forward_execution.md'
      - 'reports/walk_forward_execution/**'
      - 'research/strategy/runs/public_v3_data_handoff_request.json'
      - 'docs/archive_baseline_audit.md'
      - 'research/strategy/runs/archive_baseline_20261004_manifest.json'
      - 'research/strategy/private/archive_baseline_20261004.compact.json.enc'
      - 'tools/archive_crypto.py'
      - 'tests/test_archive_crypto.py'
      - 'tests/test_canary_evidence_ledger.py'
      - 'tests/test_archive_baseline_audit.py'
      - 'tests/test_v3_data_contract.py'
      - 'tests/test_walk_forward_intake.py'
      - 'tests/test_walk_forward_split_audit.py'
      - 'tests/test_preregistered_strategy.py'
      - 'tests/test_research_manifest_contracts.py'
      - 'tests/test_execution_realism_contract.py'
      - 'tests/test_walk_forward_execution.py'
      - 'tests/test_public_acquisition_dry_run.py'
      - 'tests/fixtures/v3_observation_*.jsonl'
      - 'tests/fixtures/walk_forward_*.jsonl'
      - 'tests/fixtures/evidence_*.json'
      - 'requirements-research.txt'
      - '.github/workflows/research-foundation.yml'
  push:
    branches: [main, work]
    paths:
      - 'research/**'
      - 'reports/canary_readiness_foundation/**'
      - 'evidence/ledger/**'
      - 'analysis/canary_evidence_ledger.py'
      - 'analysis/archive_baseline_audit.py'
      - 'analysis/v3_data_contract.py'
      - 'analysis/walk_forward_intake.py'
      - 'analysis/walk_forward_split_audit.py'
      - 'analysis/preregistered_strategy.py'
      - 'analysis/research_manifest_contracts.py'
      - 'analysis/execution_realism_contract.py'
      - 'analysis/walk_forward_execution.py'
      - 'analysis/public_acquisition_dry_run.py'
      - 'research/strategy/schema/**'
      - 'docs/walk_forward_execution.md'
      - 'reports/walk_forward_execution/**'
      - 'research/strategy/runs/public_v3_data_handoff_request.json'
      - 'docs/archive_baseline_audit.md'
      - 'research/strategy/runs/archive_baseline_20261004_manifest.json'
      - 'research/strategy/private/archive_baseline_20261004.compact.json.enc'
      - 'tools/archive_crypto.py'
      - 'tests/test_archive_crypto.py'
      - 'tests/test_canary_evidence_ledger.py'
      - 'tests/test_archive_baseline_audit.py'
      - 'tests/test_v3_data_contract.py'
      - 'tests/test_walk_forward_intake.py'
      - 'tests/test_walk_forward_split_audit.py'
      - 'tests/test_preregistered_strategy.py'
      - 'tests/test_research_manifest_contracts.py'
      - 'tests/test_execution_realism_contract.py'
      - 'tests/test_walk_forward_execution.py'
      - 'tests/test_public_acquisition_dry_run.py'
      - 'tests/fixtures/v3_observation_*.jsonl'
      - 'tests/fixtures/walk_forward_*.jsonl'
      - 'tests/fixtures/evidence_*.json'
      - 'requirements-research.txt'
      - '.github/workflows/research-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-research.txt
      - name: Encryption contract tests without secrets
        run: python -m unittest discover -s tests -p 'test_archive_crypto.py' -v
      - name: Validate CLI archive round trip without exposing plaintext
        run: |
          set -eu
          printf '%s' 'synthetic-private-note' > /tmp/archive-plain
          export ARCHIVE_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python tools/archive_crypto.py encrypt /tmp/archive-plain /tmp/archive.enc
          rm /tmp/archive-plain
          python tools/archive_crypto.py decrypt /tmp/archive.enc /tmp/archive-restored
          test "$(cat /tmp/archive-restored)" = 'synthetic-private-note'
          rm -f /tmp/archive.enc /tmp/archive-restored
      - name: Validate experiment and run manifests
        run: |
          python -m unittest discover -s tests -p 'test_research_manifest_contracts.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from analysis.research_manifest_contracts import validate_experiment_directory
          validate_experiment_directory(Path('research/strategy/experiments'))
          obj = json.loads(Path('research/strategy/runs/run-manifest.example.json').read_text())
          for key in ('manifest_version','experiment_id','run_id','commit','source','windows','command','outputs','execution_evidence','promotion','pre_registration'):
              assert key in obj, key
          assert obj['pre_registration']['strategy_id'] == 'btc5m_reference_v1'
          assert obj['execution_evidence']['real_confirmed_fills'] == 0
          assert obj['promotion']['eligible'] is False
          report = json.loads(Path('reports/canary_readiness_foundation/readiness.json').read_text())
          assert report['promotion_allowed'] is False
          assert report['current_evidence']['public_quote_only'] is True
          assert report['phase_semantics']['pre_canary_research']['ten_canary_roundtrips_required'] is False
          assert report['phase_semantics']['post_canary_completion']['ten_canary_roundtrips_required'] is True
          ledger = json.loads(Path('reports/canary_readiness_foundation/evidence_ledger.json').read_text())
          assert ledger['phase'] == 'pre_canary_research'
          assert 'ten_canary_roundtrips' not in ledger['blockers']
          assert 'ten_canary_roundtrips' in ledger['post_canary_completion']['blockers']
          print('Research and canary contracts validated.')
          PY
      - name: Compile tooling
        run: |
          python -m py_compile tools/archive_crypto.py analysis/canary_evidence_ledger.py analysis/archive_baseline_audit.py analysis/v3_data_contract.py analysis/walk_forward_intake.py analysis/walk_forward_split_audit.py analysis/execution_realism_contract.py analysis/preregistered_strategy.py analysis/research_manifest_contracts.py analysis/walk_forward_execution.py analysis/public_acquisition_dry_run.py
      - name: Validate public acquisition blocker without network
        run: |
          python -m unittest discover -s tests -p 'test_public_acquisition_dry_run.py' -v
          python analysis/public_acquisition_dry_run.py \
            --output /tmp/public-acquisition-dry-run.json
          cmp /tmp/public-acquisition-dry-run.json \
            reports/walk_forward_execution/public_acquisition_dry_run_blocked_20261005.json
      - name: Validate pre-registration gate without OOS evaluation
        run: |
          python analysis/preregistered_strategy.py \
            --manifest research/strategy/experiments/EXP-0002-btc5m-preregistered-reference.json \
            --observations tests/fixtures/v3_observation_valid.jsonl \
            --labels tests/fixtures/walk_forward_labels_valid.jsonl \
            --code-commit c3ff9549ad0b62ec19fa21c7d917781cd5e4273a \
            --evaluation-dates 2026-10-03 \
            --phase pre_evaluation --synthetic \
            --output /tmp/preregistration-synthetic.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/preregistration-synthetic.json', encoding='utf-8'))
          assert report['manifest_errors'] == []
          assert report['canary_blocked'] is True
          assert 'synthetic_input_not_evidence' in report['blockers']
          assert report['metrics']['oos'] is None
          assert report['metrics']['brier'] is None
          assert len(report['execution_realism']['cells']) == 64
          assert all(value is None for cell in report['execution_realism']['cells'] for value in cell['metrics'].values())
          print('Pre-registration gate is structural and synthetic-only.')
          PY
      - name: Check public-safe private archive paths
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files', 'research/strategy/private'], text=True).splitlines()
          for name in tracked:
              assert name.endswith(('.gitignore', '.enc')), name
              if name.endswith('.enc'):
                  envelope = json.loads(Path(name).read_text(encoding='utf-8'))
                  assert envelope['format'] == 'poly-research-archive/v1'
                  assert envelope['cipher'] == 'AES-256-GCM'
          print('Private research paths contain only policy files or authenticated ciphertext envelopes.')
          PY
      - name: Evidence ledger offline contracts
        run: |
          python -m unittest discover -s tests -p 'test_canary_evidence_ledger.py' -v
          python -m unittest discover -s tests -p 'test_v3_data_contract.py' -v
          python -m unittest discover -s tests -p 'test_archive_baseline_audit.py' -v
          python -m unittest discover -s tests -p 'test_walk_forward_intake.py' -v
          python -m unittest discover -s tests -p 'test_walk_forward_split_audit.py' -v
          python -m unittest discover -s tests -p 'test_preregistered_strategy.py' -v
          python -m unittest discover -s tests -p 'test_execution_realism_contract.py' -v
          python -m unittest discover -s tests -p 'test_walk_forward_execution.py' -v
          python analysis/canary_evidence_ledger.py \
            --input tests/fixtures/evidence_zero.json \
            --output /tmp/evidence-ledger.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/evidence-ledger.json', encoding='utf-8'))
          assert report['promotion_allowed'] is False
          assert report['observed']['real_confirmed_fill_count'] == 0
          assert report['missing_counts']['execution_evidence'] > 0
          print('Evidence ledger remains blocked without private receipts.')
          PY
      - name: Validate sealed baseline artifact without decrypting it
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('research/strategy/runs/archive_baseline_20261004_manifest.json').read_text())
          artifact = Path(manifest['artifact']['path'])
          assert artifact.is_file()
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == manifest['artifact']['sha256']
          assert manifest['artifact']['format'] == 'poly-research-archive/v1'
          assert manifest['artifact']['cipher'] == 'AES-256-GCM'
          assert manifest['artifact']['plaintext_committed'] is False
          print('Encrypted baseline artifact checksum and envelope metadata validated; plaintext not opened.')
          PY
