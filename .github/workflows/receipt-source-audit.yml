name: receipt-source-audit
on:
  pull_request:
    paths: ['analysis/receipt_source_audit.py', 'analysis/canary_receipt_state.py', 'tests/test_receipt_source_audit.py', '.github/workflows/receipt-source-audit.yml']
  push:
    branches: [main]
    paths: ['analysis/receipt_source_audit.py', 'analysis/canary_receipt_state.py', 'analysis/live_paper_trader.py', 'analysis/live_execution.py', 'tests/test_receipt_source_audit.py', '.github/workflows/receipt-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_receipt_source_audit.py' -v
      - run: python analysis/receipt_source_audit.py --output receipt_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-source-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt_audit.json
          retention-days: 14
