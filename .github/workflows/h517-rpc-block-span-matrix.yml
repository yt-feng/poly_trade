name: H517 RPC block-span matrix

on:
  workflow_dispatch:
    inputs:
      rpc_urls:
        description: Comma-separated read-only Polygon JSON-RPC endpoints
        required: false
        default: https://polygon.drpc.org,https://polygon-bor-rpc.publicnode.com
        type: string
      spans:
        description: Comma-separated block spans for scalar token/topic filter
        required: false
        default: '20,50,100,250,500,1000'
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vault dependencies
        run: python -m pip install -r requirements-vault.txt
      - name: Run bounded block-span matrix
        env:
          RPC_URLS: ${{ inputs.rpc_urls }}
          SPANS: ${{ inputs.spans }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h517"
          mkdir -m 700 "$private_dir"
          python -u analysis/h517_rpc_block_span_matrix.py \
            --output "$private_dir/matrix.json" --rpc-urls "$RPC_URLS" --spans "$SPANS" \
            > "$private_dir/matrix.stdout"
      - name: Seal and publish encrypted matrix
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h517" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tools'); import research_vault
          private=Path(sys.argv[1]); recipient=research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'],validate=True),4096); rid=os.environ['QUALITY_FIRST_RECIPIENT_ID']; research_vault.validate_recipient(recipient,rid)
          payload={'format':'h517-rpc-block-span-matrix-sealed-v1','matrix':json.loads((private/'matrix.json').read_text()),'matrix_stdout':(private/'matrix.stdout').read_text(),'workflow':{'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ref':os.environ['GITHUB_REF']}}
          delivery=Path('sealed-delivery'); delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery/'part-0000.vault',research_vault.seal(research_vault.canonical(payload),recipient,rid),0o600)
          research_vault.write_new(delivery/'status.json',research_vault.canonical({'version':1,'status':'complete','stage':'sealed_delivery','strategy_evaluated':False,'live_orders_enabled':False,'plaintext_published':False,'sealed_parts':1})+b'\n',0o644)
          PY
          PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$QUALITY_FIRST_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H517 RPC block-span matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tests only the proven scalar token/topic filter; detailed categories and counts remain encrypted.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          for path in (Path(os.environ['RUNNER_TEMP'])/'h517', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
