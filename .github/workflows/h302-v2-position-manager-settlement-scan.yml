name: H302 V2 PositionManager settlement scan

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Read-only Polygon JSON-RPC endpoint
        required: false
        default: https://polygon-bor-rpc.publicnode.com
        type: string
      receipt_rpc_url:
        description: Optional read-only Polygon JSON-RPC endpoint for transaction receipts
        required: false
        default: https://polygon-bor-rpc.publicnode.com
        type: string
      max_history_blocks:
        description: Maximum historical block span per account
        required: false
        default: '250000'
        type: string
      chunk_blocks:
        description: Block span per eth_getLogs query
        required: false
        default: '5000'
        type: string
      max_log_query_leaves:
        description: Maximum adaptive eth_getLogs leaves per original filter
        required: false
        default: '16'
        type: string

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vault and latest official SDK
        run: |
          set -euo pipefail
          python -m pip install -r requirements-vault.txt
          sdk_commit="$(git ls-remote https://github.com/Polymarket/py-sdk.git refs/heads/main | cut -f1)"
          test "${#sdk_commit}" -eq 40
          echo "POLY_SDK_COMMIT=$sdk_commit" >> "$GITHUB_ENV"
          python -m pip install "git+https://github.com/Polymarket/py-sdk.git@$sdk_commit"
      - name: Capture existing owner activity and scan V2 PositionManager settlement
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          BTC5M_POLYMARKET_PRIVATE_KEY: ${{ secrets.BTC5M_POLYMARKET_PRIVATE_KEY }}
          RPC_URL: ${{ inputs.rpc_url }}
          RECEIPT_RPC_URL: ${{ inputs.receipt_rpc_url }}
          MAX_HISTORY_BLOCKS: ${{ inputs.max_history_blocks }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
          MAX_LOG_QUERY_LEAVES: ${{ inputs.max_log_query_leaves }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h302"
          mkdir -m 700 "$private_dir"
          python - "$private_dir/keys.json" <<'PY'
          import json, os, sys
          rows=[]
          for label, env_name in (("polymarket", "POLYMARKET_PRIVATE_KEY"), ("btc5m", "BTC5M_POLYMARKET_PRIVATE_KEY")):
              value=os.environ.get(env_name, "").strip()
              if value:
                  rows.append({"label": label, "private_key": value})
          json.dump(rows, open(sys.argv[1], "w"), separators=(",", ":"))
          PY
          set +e
          python -u analysis/h279_authenticated_lifecycle_capture.py \
            --keys-file "$private_dir/keys.json" \
            --sdk-commit "$POLY_SDK_COMMIT" \
            --output "$private_dir/h279.json" \
            > "$private_dir/h279.stdout" 2> "$private_dir/h279.stderr"
          h279_rc=$?
          set -e
          export H279_RC="$h279_rc"
          python - "$private_dir" <<'PY'
          import json, re, sys
          from pathlib import Path
          private=Path(sys.argv[1])
          report=json.loads((private/'h279.json').read_text()) if (private/'h279.json').exists() else {}
          address=re.compile(r'^0x[0-9a-fA-F]{40}$')
          tx_hash=re.compile(r'^0x[0-9a-fA-F]{64}$')
          slug_re=re.compile(r'(?:^|[-_])(btc|bitcoin)[-_](?:updown|up_down)[-_]5m(?:[-_]|$)', re.I)
          accounts=[]
          for row in report.get('accounts') or []:
              counts={}
              for trade in row.get('account_trades') or []:
                  if not isinstance(trade, dict):
                      continue
                  for key in ('maker_address','owner_address','wallet_address'):
                      value=str(trade.get(key) or '').strip().lower()
                      if address.fullmatch(value):
                          counts[value]=counts.get(value, 0)+1
                          break
              if not counts:
                  continue
              owner=max(counts.items(), key=lambda item: (item[1], item[0]))[0]
              activity=[item for item in (row.get('public_data_activity') or []) if isinstance(item, dict)]
              hashes=[]
              for item in activity:
                  slug=str(item.get('slug') or item.get('eventSlug') or item.get('event_slug') or '').lower()
                  tx=str(item.get('transactionHash') or item.get('transaction_hash') or item.get('txHash') or '').lower()
                  if slug_re.search(slug) and tx_hash.fullmatch(tx):
                      hashes.append(tx)
              accounts.append({'label': row.get('label',''), 'owner': owner,
                               'activity': activity, 'btc_transaction_hashes': list(dict.fromkeys(hashes))})
          json.dump({'accounts': accounts}, open(private/'h302-input.json','w'), separators=(',',':'))
          PY
          set +e
          if python - "$private_dir/h302-input.json" <<'PY'
          import json, sys
          sys.exit(0 if json.loads(open(sys.argv[1]).read()).get('accounts') else 1)
          PY
          then
              python -u analysis/h302_v2_position_manager_settlement_scan.py \
                --input "$private_dir/h302-input.json" \
                --output "$private_dir/h302.json" \
                --rpc-url "$RPC_URL" \
                --receipt-rpc-url "$RECEIPT_RPC_URL" \
                --max-history-blocks "$MAX_HISTORY_BLOCKS" \
                --chunk-blocks "$CHUNK_BLOCKS" \
                --max-log-query-leaves "$MAX_LOG_QUERY_LEAVES"
              h302_rc=$?
          else
              h302_rc=1
              python - <<'PY' "$private_dir/h302.json"
          import json, sys
          json.dump({'format':'h302-v2-position-manager-settlement-scan-failure-v1',
                     'failure_code':'authenticated_activity_unavailable',
                     'actual_fills':0,'verified_canary_fills':0,
                     'same_ledger_compounding_rows':0,'new_data_collected':False,
                     'model_refit':False,'live_orders_enabled':False}, open(sys.argv[1],'w'), indent=2)
          PY
          fi
          set -e
          export H302_RC="$h302_rc"
          python - "$private_dir" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private=Path(sys.argv[1])
          encoded=os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64','')
          recipient_id=os.environ.get('QUALITY_FIRST_RECIPIENT_ID','')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient=research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          h279=json.loads((private/'h279.json').read_text()) if (private/'h279.json').exists() else {}
          h302=json.loads((private/'h302.json').read_text()) if (private/'h302.json').exists() else {}
          payload={'format':'h302-v2-position-manager-settlement-scan-sealed-v1',
                   'h279':h279,'h302':h302,
                   'workflow':{'run_id':os.environ['GITHUB_RUN_ID'],
                               'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                               'ref':os.environ['GITHUB_REF'],
                               'rpc_url_sha256':hashlib.sha256(os.environ.get('RPC_URL','').encode()).hexdigest(),
                               'receipt_rpc_url_sha256':hashlib.sha256(os.environ.get('RECEIPT_RPC_URL','').encode()).hexdigest()}}
          delivery=Path('sealed-delivery'); delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery/'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          complete=int(os.environ.get('H279_RC','1')) == 0 and int(os.environ.get('H302_RC','1')) == 0
          status={'version':1,'status':'complete' if complete else 'failed','stage':'sealed_delivery',
                  'strategy_evaluated':False,'live_orders_enabled':False,'plaintext_published':False,
                  'sealed_parts':1}
          if not complete:
              status['failed_stage']='research'
          research_vault.write_new(delivery/'status.json', research_vault.canonical(status)+b'\n', 0o644)
          PY
      - name: Publish only encrypted settlement scan
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H302 V2 PositionManager settlement scan' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reuses existing authenticated account activity and bounded receipt block ranges; no quote scan, model refit, order, redeem, merge, transfer, or allowance mutation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Payouts enter the cash ledger only when the successful receipt conditionId matches an existing BTC five-minute activity conditionId.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full account activity, transaction details and owner identities remain encrypted; no plaintext findings are published.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          private=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'h302'
          if private.exists(): shutil.rmtree(private)
          if Path('sealed-delivery').exists(): shutil.rmtree('sealed-delivery')
          PY
