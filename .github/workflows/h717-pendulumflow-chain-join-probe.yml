name: H717 PendulumFlow V3 chain join probe

on:
  workflow_dispatch:

concurrency:
  group: h717-pendulumflow-chain-join-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded cloud join dependencies
        run: python -m pip install -r requirements-vault.txt pyarrow requests
      - name: Join one hour to public Polygon logs and receipts
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/h717-pendulumflow-join"
          set +e
          timeout --signal=TERM --kill-after=30s 1200s \
            python analysis/h717_pendulumflow_chain_join_probe.py \
              --hour 2026-09-03/17 \
              --rpc-url https://polygon-bor-rpc.publicnode.com \
              --max-bytes $((256 * 1024 * 1024)) \
              --output "$RUNNER_TEMP/h717-pendulumflow-join/report.json"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ ! -s "$RUNNER_TEMP/h717-pendulumflow-join/report.json" ]; then
            python - "$RUNNER_TEMP/h717-pendulumflow-join/report.json" "$rc" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "format": "h717-pendulumflow-chain-join-probe-v1",
              "status": "cloud_join_step_failed",
              "decision": "incomplete_cloud_join",
              "failure_class": "bounded_cloud_step_timeout_or_error",
              "exit_code": int(sys.argv[2]),
              "strategy_evaluated": False,
              "actual_fills": 0,
              "verified_canary_fills": 0,
              "live_orders_enabled": False,
              "cash_ledger_proven": False,
          }, sort_keys=True) + "\n")
          PY
          fi
          exit "$rc"
      - name: Seal chain join report
        if: always()
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h717-pendulumflow-join" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          report = json.loads((private / 'report.json').read_text())
          payload = {
              'format': 'h717-pendulumflow-chain-join-probe-sealed-v1',
              'report': report,
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source_commit': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted chain join report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary
        if: always()
        run: |
          echo '## H717 PendulumFlow V3 chain join probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- One bounded hour joined to public Polygon OrderFilled and receipt topics; no strategy, training, orders, or canary was created.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/h717-pendulumflow-join" sealed-delivery
