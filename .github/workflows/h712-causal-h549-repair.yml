name: H712 causal H549 adaptive cash boost repair

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source commit
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: write

concurrency:
  group: h712-private-research
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RESEARCH_RECIPIENT_ID: 5d68eb70893219fd4281958caf0072d145babc30123714f070a3ba058956e7a9
      SOURCE_DATA_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sealing dependencies
        id: vault_dependencies
        run: python -m pip install -r requirements-vault.txt
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate research and delivery contracts
        run: python -m pytest -q tests/test_h712_causal_h549_repair.py tests/test_h542_adaptive_cash_policy.py tests/test_h506_h452_execution_depth_stress.py tests/test_h508_cash_fraction_depth_tradeoff.py tests/test_research_step_delivery.py
      - name: Execute registered research privately
        id: evaluate
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python tools/research_step_delivery.py run \
            --private "$RUNNER_TEMP/old-data-h712" --timeout-seconds 9900 -- \
            python -u analysis/h712_causal_h549_repair.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$RUNNER_TEMP/old-data-h712/results"
      - name: Seal execution outcome including failures
        id: seal
        if: always() && steps.vault_dependencies.outcome == 'success'
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          SETUP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python tools/research_step_delivery.py seal \
            --private "$RUNNER_TEMP/old-data-h712" --output sealed-delivery \
            --profile h712 --source-commit "$SOURCE_DATA_COMMIT"
      - name: Retain ciphertext for recovery
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: h712-causal-h549-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/part-*.vault
            sealed-delivery/status.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist encrypted outcome
        if: always() && steps.seal.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id h712-causal-h549-repair
      - name: Require valid delivered execution
        if: always() && steps.seal.outcome == 'success' && steps.evaluate.outcome == 'success'
        env:
          EVALUATION_COMPLETE: ${{ steps.seal.outputs.evaluation_complete }}
        run: test "$EVALUATION_COMPLETE" = 'true'
      - name: Public delivery summary
        if: always()
        run: |
          echo 'Research execution and diagnostics are retained through encrypted delivery.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Workflow completion does not establish strategy qualification or actual fills.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'old-data-h712', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
