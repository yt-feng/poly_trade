name: H423 public OrderFilled book-and-tape replay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATASET_BASE: https://huggingface.co/datasets/mileswangs/polymarket-btc-updown-5m-orderbook-tick-data/resolve/acb8cecf4234677823ddd8ee1275de1db48aa995
      DATES: 2026-08-08,2026-08-11,2026-08-14,2026-08-17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow cryptography
      - name: Download fixed public OrderFilled source slice
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h423"
          mkdir -m 700 -p "$private_dir/onchain"
          curl --fail --location --retry 3 --max-time 600 "$DATASET_BASE/markets.parquet" --output "$private_dir/markets.parquet"
          IFS=',' read -ra dates <<< "$DATES"
          for date in "${dates[@]}"; do
            mkdir -p "$private_dir/onchain/date=$date"
            curl --fail --location --retry 3 --max-time 900 \
              "$DATASET_BASE/onchain_fills/date=$date/part-0.parquet" \
              --output "$private_dir/onchain/date=$date/part-0.parquet"
          done
      - name: Run the pre-registered paper replay
        run: |
          set -euo pipefail
          python -u analysis/h423_orderfilled_book_tape_replay.py \
            --input-dir "$RUNNER_TEMP/h423" \
            --output "$RUNNER_TEMP/h423/report.json" \
            > "$RUNNER_TEMP/h423/analysis-output.txt" 2>&1
      - name: Seal H423 results
        id: seal
        if: always()
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h423" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          report_path = private / 'report.json'
          report = json.loads(report_path.read_text()) if report_path.exists() else None
          output_path = private / 'analysis-output.txt'
          payload = {
              'format': 'h423-orderfilled-book-tape-replay-sealed-v1',
              'status': 'complete' if report is not None else 'failed',
              'report': report,
              'report_sha256': hashlib.sha256(report_path.read_bytes()).hexdigest() if report_path.exists() else None,
              'analysis_output': output_path.read_text() if output_path.exists() else '',
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': payload['status'], 'stage': 'sealed_delivery', 'strategy_evaluated': bool(report), 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H423 journal
        if: always() && steps.seal.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Publish redacted operational status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h423-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
