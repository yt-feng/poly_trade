name: H461 H391 raw execution identity field audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATASET_REVISION: f3bfb79f19611ea3115ad29c18720166ee6dd0b5
      DATASET_BASE: https://huggingface.co/datasets/krish301/polymarket-crypto-trades-v1/resolve/f3bfb79f19611ea3115ad29c18720166ee6dd0b5/data/raw/trades/btc/5m/05-03-2026
      SOURCE_COMMIT: accd1511a08748302c8116ab65575930e1240068
      WINDOW_START: 1772668800
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the pinned H391 tape
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h461"
          mkdir -m 700 -p "$private_dir/fills"
          for minute in 00 05 10 15 20 25 30 35 40 45 50 55; do
            start=$((WINDOW_START + 300 * (10#$minute / 5)))
            curl --fail --location --retry 3 --max-time 180 \
              "$DATASET_BASE/00-${minute}-00-UTC/fills.jsonl.gz?download=true" \
              --output "$private_dir/fills/${start}.fills.jsonl.gz"
          done
      - name: Run aggregate field audit
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h461"
          python -m pytest -q tests/test_h461_h391_identity_field_audit.py
          python -u analysis/h461_h391_identity_field_audit.py \
            --fills-dir "$private_dir/fills" \
            --source-commit "$SOURCE_COMMIT" \
            --dataset-revision "$DATASET_REVISION" \
            --output "$private_dir/report.json"
      - name: Seal aggregate audit
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h461" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          report = json.loads((private / 'report.json').read_text())
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical({'format': 'h461-h391-identity-field-audit-sealed-v1', 'report': report, 'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']}}), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted audit
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H461 H391 raw execution identity field audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Audited aggregate coverage in the fixed H391 tape; raw addresses, order hashes and transaction hashes remain sealed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No strategy replay, model refit, new market data or order was performed.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h461', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
