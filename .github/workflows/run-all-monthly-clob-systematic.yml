  path-efficiency-threshold-grid-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'path_efficiency_threshold_grid'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout clean-data source repository
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: bbda5f2050685f63153621a54641ebdfab943487

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research and vault dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt

      - name: Run predeclared path-efficiency threshold grid
        env:
          PYTHONUNBUFFERED: '1'
          SOURCE_DATA_COMMIT: bbda5f2050685f63153621a54641ebdfab943487
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-path-efficiency-threshold-grid"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/causal_path_efficiency_threshold_grid.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$PRIVATE_DIR/results" \
            > "$PRIVATE_DIR/analysis-output.txt"
          python - "$PRIVATE_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          committed = research_vault.load_json_bytes(Path('research_vault/recipient.json').read_bytes(), 4096)
          if recipient_id != committed['recipient_id'] or recipient != committed:
              raise SystemExit('recipient variable does not match committed recipient')
          payload = {
              'format': 'old-data-causal-path-efficiency-threshold-grid-sealed-v1',
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'meta': json.loads((private / 'results/meta.json').read_text()),
              'metrics_csv': (private / 'results/metrics.csv').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF']},
          }
