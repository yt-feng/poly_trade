name: Build all monthly_runs CLOB systematic research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run the standard report or one sealed old-data audit'
        type: choice
        options: [systematic, book_pressure, quantml_small_cash, history_cooldown_cash, path_efficiency_strict, maker_path_shadow, registry_small_cash, registry_stable_selection, nested_walk_forward_registry, execution_aware_old_clean_candidate, compound_old_clean]
        default: systematic
  push:
    branches:
      - main
    paths:
      - 'analysis/all_monthly_clob_systematic_research.py'
      - 'analysis/all_monthly_clob_systematic_research_v2.py'
      - 'analysis/all_monthly_clob_systematic_research_v3.py'
      - 'analysis/causal_quantml_small_cash.py'
      - 'analysis/causal_path_efficiency_strict_holdout.py'
      - 'analysis/maker_path_efficiency_shadow.py'
      - 'analysis/maker_shadow_chain.py'
      - 'analysis/registry_small_cash_holdout.py'
      - 'analysis/registry_block_stability_holdout.py'
      - 'analysis/nested_walk_forward_registry.py'
      - 'analysis/execution_aware_old_clean_candidate.py'
      - 'analysis/cash_release_sensitivity.py'
      - '.github/workflows/run-all-monthly-clob-systematic.yml'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  build-all-monthly-clob-systematic:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'book_pressure' && inputs.mode != 'quantml_small_cash' && inputs.mode != 'history_cooldown_cash' && inputs.mode != 'path_efficiency_strict' && inputs.mode != 'maker_path_shadow' && inputs.mode != 'registry_small_cash' && inputs.mode != 'registry_stable_selection' && inputs.mode != 'nested_walk_forward_registry' && inputs.mode != 'execution_aware_old_clean_candidate' && inputs.mode != 'compound_old_clean')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show monthly_runs directory
        run: |
          pwd
          ls -la source_poly/data/monthly_runs || true
          find source_poly/data/monthly_runs -maxdepth 2 -type f | head -n 200 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all-monthly CLOB systematic research
        run: |
          set -euxo pipefail
          python analysis/all_monthly_clob_systematic_research_v3.py \
            --source-root source_poly/data/monthly_runs \
            --report-dir reports/all_monthly_runs_clob_systematic \
            --fee 0.01

      - name: Show generated outputs
        if: always()
        run: |
          find reports/all_monthly_runs_clob_systematic -maxdepth 4 -type f | sort || true

      - name: Publish workflow summary
        if: always()
        run: |
          echo '## All monthly_runs CLOB systematic research' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source root: `source_poly/data/monthly_runs`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Report dir: `reports/all_monthly_runs_clob_systematic/`' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/all_monthly_runs_clob_systematic/all_monthly_clob_strategy_report.md ]; then
            cat reports/all_monthly_runs_clob_systematic/all_monthly_clob_strategy_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-monthly-runs-clob-systematic-${{ github.run_id }}
          path: |
            reports/all_monthly_runs_clob_systematic
          if-no-files-found: warn

      - name: Commit outputs back to repo
        if: success()
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A reports/all_monthly_runs_clob_systematic
          if ! git diff --cached --quiet; then
            git commit -m 'Update all monthly_runs CLOB systematic research outputs [skip ci]'
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo 'No output changes to commit.'
          fi

  book-pressure-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'book_pressure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout clean-data source repository
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: bbda5f2050685f63153621a54641ebdfab943487

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research and vault dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt

      - name: Run frozen old-data comparison and seal it in the runner
        env:
          PYTHONUNBUFFERED: '1'
          SOURCE_DATA_COMMIT: bbda5f2050685f63153621a54641ebdfab943487
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-book-pressure"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/causal_path_book_pressure_alignment.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "$SOURCE_DATA_COMMIT" \
            --output "$PRIVATE_DIR/results" \
            > "$PRIVATE_DIR/analysis-output.txt"
          python - "$PRIVATE_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'old-data-causal-book-pressure-sealed-v1',
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'meta': json.loads((private / 'results/meta.json').read_text()),
              'metrics_csv': (private / 'results/metrics.csv').read_text(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY

      - name: Publish only encrypted research delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Remove runner-local plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/old-data-book-pressure" sealed-delivery

