name: H487 PMData two-sided passive maker pair replay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATASET_REVISION: acb8cecf4234677823ddd8ee1275de1db48aa995
      DATASET_SOURCE_REPO_COMMIT: b7f29614a695740c2102760a4dacfb85b8d6e623
      DATASET_BASE: https://huggingface.co/datasets/mileswangs/polymarket-btc-updown-5m-orderbook-tick-data/resolve/acb8cecf4234677823ddd8ee1275de1db48aa995
      HYPOTHESIS_ID: H487_PMDATA_TWO_SIDED_PASSIVE_COMPLETE_SET
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install polars pyarrow pytest cryptography

      - name: Download one fixed historical archive day
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h487"
          mkdir -m 700 "$private_dir"
          curl --fail --location --retry 3 --max-time 900 \
            "$DATASET_BASE/markets.parquet?download=true" --output "$private_dir/markets.parquet"
          curl --fail --location --retry 3 --max-time 900 \
            "$DATASET_BASE/l2/date=2026-08-08/part-0.parquet?download=true" --output "$private_dir/l2.parquet"
          curl --fail --location --retry 3 --max-time 900 \
            "$DATASET_BASE/trades/date=2026-08-08/part-0.parquet?download=true" --output "$private_dir/trades.parquet"
          curl --fail --location --retry 3 --max-time 900 \
            "$DATASET_BASE/onchain_fills/date=2026-08-08/part-0.parquet?download=true" --output "$private_dir/fills.parquet"

      - name: Run H487 two-sided maker pair replay
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h487"
          python -m pytest -q tests/test_h487_pmdata_maker_pair_replay.py
          python -u analysis/h487_pmdata_maker_pair_replay.py \
            --l2 "$private_dir/l2.parquet" \
            --trades "$private_dir/trades.parquet" \
            --markets "$private_dir/markets.parquet" \
            --fills "$private_dir/fills.parquet" \
            --output "$private_dir/results" > "$private_dir/analysis-output.txt"

      - name: Seal H487 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h487" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault

          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          report_bytes = (private / 'results' / 'report.json').read_bytes()
          payload = {
              'format': 'old-pmdata-h487-maker-pair-replay-sealed-v1',
              'hypothesis_id': os.environ['HYPOTHESIS_ID'],
              'preregistration': {
                  'objective': 'Two simultaneous post-only binary legs form complete sets and reuse one evolving USD10 ledger.',
                  'dataset_revision': os.environ['DATASET_REVISION'],
                  'dataset_source_repo_commit': os.environ['DATASET_SOURCE_REPO_COMMIT'],
                  'initial_cash_usd': 10.0,
                  'minimum_order_notional_usd_per_leg': 5.0,
                  'minimum_pair_edge': 0.005,
                  'both_legs_required': True,
                  'same_ledger': True,
                  'no_reset': True,
                  'no_concatenation': True,
                  'required_consecutive_pairs': 10,
                  'paper_only': True,
              },
              'report': json.loads(report_bytes),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'hashes': {'report_sha256': hashlib.sha256(report_bytes).hexdigest()},
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'ref': os.environ['GITHUB_REF'],
                  'head_sha': os.environ['GITHUB_SHA'],
                  'dataset_revision': os.environ['DATASET_REVISION'],
                  'dataset_source_repo_commit': os.environ['DATASET_SOURCE_REPO_COMMIT'],
              },
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY

      - name: Publish encrypted H487 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Redacted completion and cleanup
        if: always()
        run: |
          echo '## H487 PMData two-sided passive maker pair replay' >> "$GITHUB_STEP_SUMMARY"
          echo '- One immutable historical day, two post-only legs, both-fill admission, and one evolving $10 ledger.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No live order, owner receipt or Canary row is created; detailed metrics remain encrypted.' >> "$GITHUB_STEP_SUMMARY"
