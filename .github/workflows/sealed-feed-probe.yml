name: sealed-feed-probe
on:
  pull_request:
    paths:
      - '.github/workflows/sealed-feed-probe.yml'
      - '.github/workflows/sealed-journal-persist.yml'
      - 'tools/run_public_feed_probe.py'
      - 'tools/sealed_public_feed.py'
      - 'tools/research_vault.py'
      - 'tools/run_quality_first_research.py'
      - 'tools/*quality_first_journal.py'
      - 'tests/test_public_feed_probe.py'
      - 'tests/test_sealed_public_feed.py'
      - 'requirements-vault.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sealed-feed-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Synthetic feed, probe and sealed delivery contracts
        run: |
          python -m unittest discover -s tests -p 'test_public_feed_probe.py' -v
          python -m unittest discover -s tests -p 'test_sealed_public_feed.py' -v
          python -m unittest discover -s tests -p 'test_persist_quality_first_journal.py' -v
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Fixed public availability observation with ciphertext-only delivery
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: python -u tools/run_public_feed_probe.py --output sealed-delivery
      - name: Deliver ciphertext and generic operational status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-first-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/*.vault
            sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
