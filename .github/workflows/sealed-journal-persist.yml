name: sealed-journal-persist
on:
  workflow_run:
    workflows: [sealed-source-coverage, canary-readiness-research, quality-first-research, sealed-feed-probe]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sealed-research-journal-publication
  cancel-in-progress: false
jobs:
  persist:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - uses: actions/download-artifact@v4
        with:
          name: quality-first-sealed-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: sealed-input
      - name: Verify allowlisted ciphertext and persist with remote readback
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python tools/publish_quality_first_journal.py \
            --source sealed-input \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
