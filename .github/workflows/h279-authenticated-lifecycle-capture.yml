name: H279 authenticated lifecycle capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vault and latest official SDK
        run: |
          set -euo pipefail
          python -m pip install -r requirements-vault.txt
          sdk_commit="$(git ls-remote https://github.com/Polymarket/py-sdk.git refs/heads/main | cut -f1)"
          test "${#sdk_commit}" -eq 40
          echo "POLY_SDK_COMMIT=$sdk_commit" >> "$GITHUB_ENV"
          python -m pip install "git+https://github.com/Polymarket/py-sdk.git@$sdk_commit"
      - name: Capture read-only authenticated lifecycle bundle
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          BTC5M_POLYMARKET_PRIVATE_KEY: ${{ secrets.BTC5M_POLYMARKET_PRIVATE_KEY }}
          POLY_SDK_COMMIT: ${{ env.POLY_SDK_COMMIT }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h279"
          mkdir -m 700 "$private_dir"
          python - "$private_dir/keys.json" <<'PY'
          import json, os, sys
          rows=[]
          for label, env_name in (("polymarket", "POLYMARKET_PRIVATE_KEY"), ("btc5m", "BTC5M_POLYMARKET_PRIVATE_KEY")):
              value=os.environ.get(env_name, "").strip()
              if value:
                  rows.append({"label": label, "private_key": value})
          json.dump(rows, open(sys.argv[1], "w"), separators=(",", ":"))
          PY
          set +e
          python -u analysis/h279_authenticated_lifecycle_capture.py \
            --keys-file "$private_dir/keys.json" \
            --sdk-commit "$POLY_SDK_COMMIT" \
            --output "$private_dir/report.json" \
            > "$private_dir/stdout" 2> "$private_dir/stderr"
          capture_rc=$?
          set -e
          export CAPTURE_RC="$capture_rc"
          cat "$private_dir/stdout" || true
          python - "$private_dir" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private=Path(sys.argv[1])
          encoded=os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id=os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient=research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          capture_rc=int(os.environ.get('CAPTURE_RC','1'))
          if (private/'report.json').exists():
              report=json.loads((private/'report.json').read_text())
              status='complete' if capture_rc == 0 else 'failed'
              failed_stage=None if capture_rc == 0 else 'research'
          else:
              report={
                  'format':'h279-authenticated-lifecycle-capture-failure-v1',
                  'failure_code':'authenticated_capture_failed',
                  'sdk_commit':os.environ.get('POLY_SDK_COMMIT',''),
                  'strategy_evaluated':False,
                  'new_data_collected':False,
                  'model_refit':False,
                  'actual_fills':0,
                  'verified_canary_fills':0,
                  'same_ledger_compounding_rows':0,
                  'live_orders_enabled':False,
              }
              status='failed'
              failed_stage='research'
          payload={
              'format':'h279-authenticated-lifecycle-capture-sealed-v1',
              'report':report,
              'workflow':{'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ref':os.environ['GITHUB_REF']},
          }
          delivery=Path('sealed-delivery'); delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery/'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          status_record={'version':1,'status':status,'stage':'sealed_delivery','strategy_evaluated':False,'live_orders_enabled':False,'plaintext_published':False,'sealed_parts':1}
          if failed_stage:
              status_record['failed_stage']=failed_stage
          research_vault.write_new(delivery/'status.json', research_vault.canonical(status_record)+b'\n',0o644)
          PY
      - name: Publish only encrypted lifecycle delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H279 authenticated lifecycle capture' >> "$GITHUB_STEP_SUMMARY"
          echo '- Uses the latest official Polymarket Python SDK and derives existing API credentials with GET only.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reads account trades, public activity and balance/allowance only; no order, cancel, merge, redeem or allowance mutation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full report and account identities remain encrypted; no plaintext findings are published.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          private=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'h279'
          if private.exists(): shutil.rmtree(private)
          delivery=Path('sealed-delivery')
          if delivery.exists(): shutil.rmtree(delivery)
          PY
