name: quality-first-research
on:
  pull_request:
    paths:
      - '.github/workflows/quality-first-research.yml'
      - 'tools/run_quality_first_research.py'
      - 'tools/research_dispatch_preflight.py'
      - 'tools/*quality_first_journal.py'
      - '.github/workflows/sealed-journal-persist.yml'
      - 'tests/test_persist_quality_first_journal.py'
      - 'tests/test_research_dispatch_preflight.py'
      - 'analysis/quality_first_*.py'
      - 'tests/test_quality_first*.py'
  workflow_dispatch:
    inputs:
      research_mode:
        description: 'Discovery, fixed research-only challenger export, or frozen paper episode'
        type: choice
        options: [discovery, challenger, forward]
        default: discovery
      recipient_json_b64:
        description: 'Base64 of an existing X25519 PUBLIC recipient JSON; never a private key'
        type: string
        required: false
      recipient_id:
        description: 'Independently checked public recipient SHA256 fingerprint'
        type: string
        required: false
      max_releases:
        description: 'Recent release discovery cap (16 to 96); complete shards sampled across UTC dates'
        type: string
        default: '64'
      max_snapshot_archives:
        description: 'Complete snapshot shard cap (8 to 512); equal per-day byte quotas'
        type: string
        default: '96'
      max_bytes:
        description: 'Download byte budget (64 MiB to 2 GiB)'
        type: string
        default: '1073741824'
      initial_cash:
        description: 'Research-only initial cash, USD (no funding or orders)'
        type: string
        default: '10'
  workflow_call:
    inputs:
      research_mode:
        type: string
        default: discovery
      recipient_json_b64:
        type: string
        required: false
      recipient_id:
        type: string
        required: false
      max_releases:
        type: string
        default: '64'
      max_snapshot_archives:
        type: string
        default: '96'
      max_bytes:
        type: string
        default: '1073741824'
      initial_cash:
        type: string
        default: '10'
    secrets:
      QUALITY_FIRST_FROZEN_INPUT_B64:
        required: false
permissions:
  contents: read
concurrency:
  group: quality-first-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dispatch envelope before research
        env:
          RESEARCH_MODE: ${{ inputs.research_mode || 'discovery' }}
          FROZEN_INPUT_B64: ${{ secrets.QUALITY_FIRST_FROZEN_INPUT_B64 }}
        run: python tools/research_dispatch_preflight.py --mode "$RESEARCH_MODE"
  contract:
    needs: dispatch-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt pytest numpy==2.4.6 scipy==1.17.1 pandas==3.1.0 scikit-learn==1.9.1 joblib==1.6.0 threadpoolctl==3.7.0
      - name: Synthetic research, selection and sealed-delivery contracts
        run: python -m pytest -q tests/test_quality_first*.py tests/test_persist_quality_first_journal.py tests/test_research_dispatch_preflight.py
  research:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Restore only previously verified PUBLIC archive bytes
        uses: actions/cache/restore@v4
        with:
          path: .cache/quality-first-public-archives
          key: quality-first-public-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quality-first-public-v1-${{ runner.os }}-
      - name: Date-stratified public acquisition and sealed research
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_JSON_B64: ${{ inputs.recipient_json_b64 || vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          RESEARCH_RECIPIENT_ID: ${{ inputs.recipient_id || vars.QUALITY_FIRST_RECIPIENT_ID }}
          MAX_RELEASES: ${{ inputs.max_releases }}
          MAX_SNAPSHOT_ARCHIVES: ${{ inputs.max_snapshot_archives }}
          MAX_BYTES: ${{ inputs.max_bytes }}
          INITIAL_CASH: ${{ inputs.initial_cash }}
          RESEARCH_MODE: ${{ inputs.research_mode }}
          FROZEN_INPUT_B64: ${{ secrets.QUALITY_FIRST_FROZEN_INPUT_B64 }}
        run: |
          ulimit -v 3145728
          MODE_ARGS=()
          if [ "$RESEARCH_MODE" = forward ]; then
            python - <<'PY'
          import base64, os
          from pathlib import Path
          data=base64.b64decode(os.environ['FROZEN_INPUT_B64'],validate=True)
          if not data or len(data)>4*1024*1024: raise SystemExit('Frozen episode input unavailable')
          path=Path(os.environ['RUNNER_TEMP'])/'frozen-input.json'
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as handle: handle.write(data)
          PY
            MODE_ARGS=(--frozen-model "$RUNNER_TEMP/frozen-input.json")
          elif [ "$RESEARCH_MODE" = challenger ]; then
            MODE_ARGS=(--research-challenger spot_residual)
          elif [ "$RESEARCH_MODE" != discovery ]; then
            exit 2
          fi
          unset FROZEN_INPUT_B64
          python -u tools/run_quality_first_research.py \
            --cache .cache/quality-first-public-archives \
            --max-releases "$MAX_RELEASES" \
            --max-snapshot-archives "$MAX_SNAPSHOT_ARCHIVES" \
            --max-bytes "$MAX_BYTES" \
            --initial-cash "$INITIAL_CASH" \
            --output sealed-delivery "${MODE_ARGS[@]}"
      - name: Remove temporary frozen input
        if: always()
        run: rm -f "$RUNNER_TEMP/frozen-input.json"
      - name: Save only PUBLIC archive bytes for checksum-verified reuse
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .cache/quality-first-public-archives
          key: quality-first-public-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deliver ciphertext and generic operational status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-first-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/*.vault
            sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
