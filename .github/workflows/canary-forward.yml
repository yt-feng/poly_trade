name: canary-forward
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/canary-forward.yml']
permissions:
  contents: read
jobs:
  publication-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report publication hold without evaluating or exposing research
        run: echo 'PLAINTEXT_PUBLICATION_RETIRED. Registry and prior results are unchanged. No strategy evaluation or live action ran.'
