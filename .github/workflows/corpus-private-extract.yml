name: corpus-private-extract
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Extract a bounded batch or read existing private evidence only
        type: choice
        required: true
        default: extract
        options:
          - extract
          - readback
      pdf_ocr:
        description: Enable OCR for this bounded cloud batch
        type: choice
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'
      max_metadata:
        description: Number of source metadata entries to schedule
        type: choice
        required: true
        default: '16'
        options:
          - '2'
          - '4'
          - '8'
          - '16'
          - '32'
          - '64'
      max_files:
        description: Maximum files for one worker batch
        type: choice
        required: true
        default: '8'
        options:
          - '1'
          - '2'
          - '4'
          - '8'
          - '16'
          - '32'
      max_units:
        description: Maximum units for one worker batch
        type: choice
        required: true
        default: '80'
        options:
          - '10'
          - '20'
          - '40'
          - '80'
          - '120'
          - '200'
      recovery_source_ids:
        description: Optional comma-separated source IDs for a bounded retained-failure recovery
        type: string
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: corpus-private-extract
  # A dispatch can remain in GitHub's pre-queue state indefinitely while the
  # REST cancel endpoint rejects it as "not queued yet".  Let the next
  # explicitly registered bounded batch take over that stale control-plane
  # handle; the local checkpoint still prevents duplicate cursor credit.
  cancel-in-progress: true
jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Compile trusted orchestration source without executing corpus contents
        run: |
          python -m py_compile tools/run_corpus_extract.py tools/corpus_worker.py
          python -m unittest discover -s tests -p 'test_corpus_extract.py' -v
          python -m unittest discover -s tests -p 'test_corpus_worker_ocr.py' -v
          python -m unittest discover -s tests -p 'test_corpus_worker_recovery.py' -v
      - name: Bounded private cloud extraction and sealed evidence
        env:
          CORPUS_EXTRACT_MODE: ${{ inputs.mode }}
          CORPUS_PDF_OCR: ${{ inputs.pdf_ocr }}
          CORPUS_MAX_METADATA: ${{ inputs.max_metadata }}
          CORPUS_MAX_FILES: ${{ inputs.max_files }}
          CORPUS_MAX_UNITS: ${{ inputs.max_units }}
          CORPUS_RECOVERY_SOURCE_IDS: ${{ inputs.recovery_source_ids }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          CORPUS_SSH_HOST: ${{ secrets.CORPUS_SSH_HOST }}
          CORPUS_SSH_USER: ${{ secrets.CORPUS_SSH_USER }}
          CORPUS_SSH_KNOWN_HOSTS: ${{ secrets.CORPUS_SSH_KNOWN_HOSTS }}
          CORPUS_DELIVERY_ACK_B64: ${{ secrets.CORPUS_DELIVERY_ACK_B64 }}
          AWS_ADMIN_SSH_KEY: ${{ secrets.AWS_ADMIN_SSH_KEY }}
        run: python tools/run_corpus_extract.py --output sealed-delivery --direct-json-output sealed-direct-json
      - name: Deliver ciphertext and generic operational status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-first-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/*.vault
            sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Deliver direct encrypted JSON readback
        if: ${{ !cancelled() && hashFiles('sealed-direct-json/status.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-direct-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-direct-json/part-*.vault
            sealed-direct-json/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Persist direct encrypted JSON readback
        if: ${{ !cancelled() && hashFiles('sealed-direct-json/status.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-direct-json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id corpus-direct-readback
