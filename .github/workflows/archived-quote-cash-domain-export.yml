name: archived-quote-cash-domain-export

on:
  workflow_dispatch:
    inputs:
      request_sha256:
        description: Digest of the registered private audit configuration
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: offline-policy-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        id: code
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sealing dependency before private setup
        id: vault_dependencies
        run: python -m pip install -r requirements-vault.txt
      - name: Materialize registered private configuration
        id: configuration
        env:
          AUDIT_CONFIG_B64: ${{ secrets.ARCHIVED_QUOTE_CASH_DOMAIN_CONFIG_B64 }}
          EXPECTED_SHA256: ${{ inputs.request_sha256 }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, re
          from pathlib import Path
          private = Path(os.environ['RUNNER_TEMP']) / 'archived-quote-cash-domain-export'
          private.mkdir(mode=0o700)
          try:
              assert 0 < len(os.environ['AUDIT_CONFIG_B64']) <= 45000
              packed = base64.b64decode(os.environ['AUDIT_CONFIG_B64'], validate=True)
              assert 0 < len(packed) <= 49152
              decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=67108864)
              raw = decoder.decompress(packed, max_length=262145)
              assert 0 < len(raw) <= 262144
              assert decoder.eof and not decoder.unused_data
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ['EXPECTED_SHA256'])
              assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_SHA256']
              config = json.loads(raw)
              assert re.fullmatch(r'[0-9a-f]{40}', config['source_commit'])
              fd = os.open(private / 'config.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(raw)
              with open(os.environ['GITHUB_ENV'], 'a') as handle:
                  handle.write('AUDIT_SOURCE_COMMIT=' + config['source_commit'] + '\n')
          except Exception:
              raise SystemExit('Private audit configuration missing or invalid') from None
          PY
      - name: Checkout immutable source archive
        id: source
        uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          ref: ${{ env.AUDIT_SOURCE_COMMIT }}
          path: source_poly
          persist-credentials: false
      - name: Install offline dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 pandas==3.1.0 joblib==1.6.0 threadpoolctl==3.7.0 pytest pycryptodome
      - name: Verify offline audit contracts
        id: contracts
        run: python -m pytest -q tests/test_timed_quote_execution.py tests/test_offline_bid_residual_audit.py tests/test_archived_quote_cash_domain_export.py
      - name: Export registered archived quote domain
        id: evaluate
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: |
          python analysis/archived_quote_cash_domain_export.py \
            --config "$RUNNER_TEMP/archived-quote-cash-domain-export/config.json" \
            --source-root source_poly/data/monthly_runs \
            --output "$RUNNER_TEMP/archived-quote-cash-domain-export/results" \
            > "$RUNNER_TEMP/archived-quote-cash-domain-export/analysis-output.txt" 2>&1
      - name: Seal outcome including evaluation failures
        id: seal
        if: always() && steps.code.outcome == 'success'
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          SETUP_OUTCOMES: ${{ toJSON(steps) }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          import run_quality_first_research as bundle
          private = Path(os.environ['RUNNER_TEMP']) / 'archived-quote-cash-domain-export'
          private.mkdir(mode=0o700, parents=True, exist_ok=True)
          recipient = research_vault.load_json_bytes(Path('research_vault/recipient.json').read_bytes(), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          if (private / 'config.json').is_file():
              shutil.copyfile(private / 'config.json', private / 'frozen_input.json')
              (private / 'frozen_input.json').chmod(0o600)
          try:
              summary = json.loads((private / 'results/summary.json').read_text())
          except (OSError, ValueError, TypeError):
              summary = {}
          evidence_exported = (
              os.environ['EVALUATION_OUTCOME'] == 'success'
              and isinstance(summary, dict)
              and summary.get('evidence_exported') is True
              and summary.get('export_status') == 'complete'
              and summary.get('all_identity_gates_passed') is True
              and summary.get('strategy_evaluated') is False
              and type(summary.get('actual_model_fit_calls')) is int and summary['actual_model_fit_calls'] == 0
              and type(summary.get('actual_model_predict_calls')) is int and summary['actual_model_predict_calls'] == 0
              and type(summary.get('replayed_cells')) is int and summary['replayed_cells'] == 0
              and type(summary.get('exported_rows')) is int and summary['exported_rows'] > 0
          )
          def observed_counter(field):
              value = summary.get(field) if isinstance(summary, dict) else None
              if type(value) is int and value >= 0:
                  return value
              if os.environ['EVALUATION_OUTCOME'] in ('skipped', ''):
                  return 0
              return None
          fit_calls = observed_counter('actual_model_fit_calls')
          predict_calls = observed_counter('actual_model_predict_calls')
          replayed_cells = observed_counter('replayed_cells')
          metadata = {
              'format': 'archived-quote-cash-domain-export-sealed-v1',
              'workflow': {key: os.environ.get(key) for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'EVALUATION_OUTCOME', 'REQUEST_SHA256', 'SETUP_OUTCOMES')},
              'live_orders_enabled': False, 'actual_fills': 0, 'verified_canary_fills': 0,
              'strategy_evaluated': False,
              'evaluation_class': 'registered_old_archive_evidence_enrichment_no_strategy_evaluation',
              'evidence_exported': evidence_exported,
              'model_refit': fit_calls > 0 if fit_calls is not None else None,
              'actual_model_fit_calls': fit_calls, 'actual_model_predict_calls': predict_calls,
              'replayed_cells': replayed_cells,
              'allowed_model_fit_calls': 0, 'allowed_model_predict_calls': 0, 'allowed_replay_cells': 0,
              'new_data_collected': False,
          }
          research_vault.write_new(private / 'run.json', research_vault.canonical(metadata), 0o600)
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          part_count = bundle.deliver_bundle(bundle.make_bundle(private), delivery, recipient, recipient_id)
          status = {'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': part_count}
          research_vault.write_new(delivery / 'status.json', research_vault.canonical(status) + b'\n', 0o644)
          PY
      - name: Retain ciphertext for idempotent recovery
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sealed-archived-quote-cash-domain-export
          path: sealed-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Persist encrypted outcome
        if: always() && steps.seal.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RECIPIENT_ID"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'archived-quote-cash-domain-export', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
