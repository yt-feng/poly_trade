name: quantml-semantic-synthesis
on:
  workflow_dispatch:
    inputs:
      recovery_source_id:
        description: 'One distinct registered QuantML source cursor; bounded readback only'
        required: false
        type: string
        default: '095f61199323118a9c952831583a344760945c3a50d36429c57408b121cb5f60'
permissions:
  contents: write
concurrency:
  group: quantml-semantic-synthesis
  cancel-in-progress: false
jobs:
  synthesize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Compile cloud-only semantic controller
        run: python -m py_compile tools/run_semantic_synthesis.py tools/run_corpus_extract.py tools/corpus_worker.py
      - name: Read back one source cursor and synthesize through DeepSeek
        env:
          CORPUS_EXTRACT_MODE: readback
          CORPUS_PDF_OCR: 'false'
          CORPUS_MAX_METADATA: '1'
          CORPUS_MAX_FILES: '1'
          CORPUS_MAX_UNITS: '2'
          CORPUS_RECOVERY_SOURCE_IDS: ${{ inputs.recovery_source_id || '095f61199323118a9c952831583a344760945c3a50d36429c57408b121cb5f60' }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          CORPUS_SSH_HOST: ${{ secrets.CORPUS_SSH_HOST }}
          CORPUS_SSH_USER: ${{ secrets.CORPUS_SSH_USER }}
          CORPUS_SSH_KNOWN_HOSTS: ${{ secrets.CORPUS_SSH_KNOWN_HOSTS }}
          CORPUS_DELIVERY_ACK_B64: ${{ secrets.CORPUS_DELIVERY_ACK_B64 }}
          AWS_ADMIN_SSH_KEY: ${{ secrets.AWS_ADMIN_SSH_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/run_semantic_synthesis.py
      - name: Upload sealed result only
        uses: actions/upload-artifact@v4
        with:
          name: quantml-semantic-synthesis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/continuous-research-20261016/semantic-synthesis-20261028-delivery/*.vault
            output/continuous-research-20261016/semantic-synthesis-20261028-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
