name: H400 fixed L2 budget-capacity replay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATASET_REVISION: da05a396d41d8065dd3712ef9d6c18f1cf03e7dd
      DATASET_URL: https://huggingface.co/datasets/polyorderbooks/polymarket-crypto-btc-5min-250ms-l2/resolve/da05a396d41d8065dd3712ef9d6c18f1cf03e7dd/btc.parquet
      HYPOTHESIS_ID: H400-fixed-l2-budget-capacity
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded replay dependencies
        run: python -m pip install pandas pyarrow cryptography

      - name: Run predeclared capacity replay
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h400"
          mkdir -m 700 "$private_dir"
          curl --fail --location --retry 3 --max-time 900 "$DATASET_URL" --output "$private_dir/btc.parquet"
          python -m unittest discover -s tests -p 'test_h324_polyorderbooks_5m_replay.py' -q
          python -u analysis/h324_polyorderbooks_5m_replay.py \
            --input "$private_dir/btc.parquet" \
            --output "$private_dir/results" \
            --fractions "0.5,1.0" \
            > "$private_dir/analysis-output.txt"

      - name: Seal H400 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h400" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault

          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          report = json.loads((results / 'report.json').read_text())
          report['hypothesis_id'] = os.environ['HYPOTHESIS_ID']
          report['source_scope'] = 'existing fixed public L2 revision reused for a one-time budget-capacity audit'
          report['new_market_data_collected'] = False
          payload = {
              'format': 'h400-fixed-l2-budget-capacity-sealed-v1',
              'hypothesis_id': os.environ['HYPOTHESIS_ID'],
              'report': report,
              'metrics_csv': (results / 'metrics.csv').read_text(),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'ref': os.environ['GITHUB_REF'],
                  'head_sha': os.environ['GITHUB_SHA'],
                  'dataset_revision': os.environ['DATASET_REVISION'],
              },
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': True, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY

      - name: Publish encrypted H400 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Redacted completion and cleanup
        if: always()
        run: |
          echo '## H400 fixed L2 budget-capacity replay' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reused the fixed public L2 revision with 50% and 100% free-cash caps under the same $10/$5 chronological ledger.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Detailed metrics remain encrypted; no order, wallet sample, settlement receipt or Canary row is published.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h400', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
