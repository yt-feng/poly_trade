name: H678 causal prefix repair

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source commit
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy scikit-learn pytest
      - name: Validate causal repair code without loading the dataset locally
        run: python -m py_compile analysis/h678_causal_prefix_repair.py
      - name: Run pinned old-clean causal repair in the cloud
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h678"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h678_causal_prefix_repair.py \
            --source-root source_poly/data/monthly_runs \
            --output "$PRIVATE_DIR/causal-prefix-results.csv"
      - name: Seal H678 result
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          SOURCE_DATA_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h678" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          files = {}
          for path in sorted(private.glob('causal-prefix-results*')):
              if path.is_file() and path.stat().st_size <= 20_000_000:
                  files[path.name] = path.read_text(encoding='utf-8')
          meta = json.loads((private / 'causal-prefix-results_meta.json').read_text(encoding='utf-8'))
          payload = research_vault.canonical({
              'format': 'old-clean-h678-causal-prefix-repair-sealed-v1',
              'meta': meta,
              'derived_files': files,
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'source_commit': os.environ['SOURCE_DATA_COMMIT'],
              },
              'actual_fills': 0,
              'verified_canary_fills': 0,
              'live_orders_enabled': False,
              'plaintext_published': False,
          })
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(payload, recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({
              'version': 1, 'status': 'complete', 'stage': 'sealed_delivery',
              'strategy_evaluated': True, 'live_orders_enabled': False,
              'plaintext_published': False, 'sealed_parts': 1,
          }) + b'\n', 0o644)
          PY
      - name: Publish encrypted H678 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: PYTHONPATH=tools python tools/publish_quality_first_journal.py --source sealed-delivery --repository yt-feng/poly_trade --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipient-id "$RESEARCH_RECIPIENT_ID" --cell-id h678-causal-prefix-repair
      - name: Upload ciphertext and generic status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: h678-causal-prefix-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/part-0000.vault
            sealed-delivery/status.json
          if-no-files-found: error
          retention-days: 14
      - name: Redacted summary
        if: always()
        run: |
          echo '## H678 causal prefix repair' >> "$GITHUB_STEP_SUMMARY"
          echo '- Reused the pinned old-clean source and evaluated a minute-one-only candidate under the same-ledger paper compound gate.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Detailed metrics remain encrypted; no orders, transfers, or canary fills were created.' >> "$GITHUB_STEP_SUMMARY"
