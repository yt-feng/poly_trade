name: H277 owner-scoped public OrderFilled probe

on:
  workflow_dispatch:
    inputs:
      window_blocks:
        description: 'Bounded finalized Polygon block window'
        required: true
        default: '20000'
        type: string
      chunk_blocks:
        description: 'RPC chunk size'
        required: true
        default: '1000'
        type: string
      max_logs:
        description: 'Maximum decoded public logs'
        required: true
        default: '2000'
        type: string

permissions:
  contents: write

jobs:
  owner-scoped-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded probe dependencies
        run: |
          python -m pip install -r requirements-vault.txt eth-account
          sdk_commit="$(git ls-remote https://github.com/Polymarket/py-sdk.git refs/heads/main | cut -f1)"
          test "${#sdk_commit}" -eq 40
          echo "POLY_SDK_COMMIT=$sdk_commit" >> "$GITHUB_ENV"
          python -m pip install "git+https://github.com/Polymarket/py-sdk.git@$sdk_commit"
      - name: Derive private-runner owner labels and run read-only probe
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          BTC5M_POLYMARKET_PRIVATE_KEY: ${{ secrets.BTC5M_POLYMARKET_PRIVATE_KEY }}
          WINDOW_BLOCKS: ${{ inputs.window_blocks }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
          MAX_LOGS: ${{ inputs.max_logs }}
          POLY_SDK_COMMIT: ${{ env.POLY_SDK_COMMIT }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/h277"
          mkdir -m 700 "$PRIVATE_DIR"
          python - "$PRIVATE_DIR/owners.json" <<'PY'
          import json, os, sys
          from eth_account import Account
          from polymarket import SecureClient
          from analysis.h279_authenticated_lifecycle_capture import (
              _bounded_items,
              _derive_credentials,
              _public_data_wallet,
          )
          output = []
          for label, env_name in (("polymarket", "POLYMARKET_PRIVATE_KEY"), ("btc5m", "BTC5M_POLYMARKET_PRIVATE_KEY")):
              key = os.environ.get(env_name, "").strip()
              if key:
                  signer = Account.from_key(key)
                  credentials = _derive_credentials(key)
                  client = SecureClient.create(
                      private_key=key,
                      wallet=signer.address,
                      credentials=credentials,
                  )
                  try:
                      trades, _ = _bounded_items(client.list_account_trades())
                      address, source = _public_data_wallet(trades, client.wallet)
                  finally:
                      client.close()
                  output.append({"label": label, "address": address, "source": source})
          if not output:
              raise SystemExit("no private runner key available")
          json.dump(output, open(sys.argv[1], "w"), separators=(",", ":"))
          PY
          python -u analysis/h277_owner_scoped_orderfilled_probe.py \
            --owners-file "$PRIVATE_DIR/owners.json" \
            --output "$PRIVATE_DIR/report.json" \
            --window-blocks "$WINDOW_BLOCKS" \
            --chunk-blocks "$CHUNK_BLOCKS" \
            --max-logs "$MAX_LOGS"
          python - "$PRIVATE_DIR" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'h277-owner-scoped-orderfilled-probe-sealed-v1',
              'report': json.loads((private / 'report.json').read_text()),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish only encrypted probe delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Write redacted workflow summary
        if: always()
        run: |
          echo '## H277 owner-scoped public OrderFilled probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing authenticated account-trade GET rows were used to derive proxy/owner labels before the read-only public-chain join.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw owner identities and event details remain in the encrypted research vault.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No order, cancellation, redemption, balance read, or live execution was enabled.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner-local plaintext and owner material
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil
          private = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'h277'
          if private.exists():
              shutil.rmtree(private)
          delivery = Path('sealed-delivery')
          if delivery.exists():
              shutil.rmtree(delivery)
          PY
