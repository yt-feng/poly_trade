name: H465 old-clean H453 strict cutoff

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Pinned old-clean source
        required: true
        default: bbda5f2050685f63153621a54641ebdfab943487
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yt-feng/poly
          path: source_poly
          fetch-depth: 1
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-vault.txt pandas numpy scikit-learn pytest
      - name: Validate H465 contract
        run: python -m pytest -q tests/test_h465_old_clean_fraction_strict_cutoff.py tests/test_h465_workflow_contract.py
      - name: Run H465 on pinned old-clean source
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          echo 'H465_H453_FULL_CASH_STRICT_60S_CUTOFF'
          PRIVATE_DIR="$RUNNER_TEMP/old-data-h465"
          mkdir -m 700 "$PRIVATE_DIR"
          python -u analysis/h465_old_clean_fraction_strict_cutoff.py \
            --source-root source_poly/data/monthly_runs \
            --source-commit "${{ inputs.source_commit }}" \
            --output "$PRIVATE_DIR/results" > "$PRIVATE_DIR/analysis-output.txt"
      - name: Seal H465 results
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
          SOURCE_DATA_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/old-data-h465" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          results = private / 'results'
          summary = (results / 'summary.json').read_bytes()
          payload = {
              'format': 'old-clean-h465-h453-strict-cutoff-sealed-v1',
              'summary': json.loads(summary),
              'analysis_output': (private / 'analysis-output.txt').read_text(),
              'rolling_window_metrics_csv': (results / 'rolling_window_metrics.csv').read_text(),
              'workflow': {
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'head_sha': os.environ['GITHUB_SHA'],
                  'source_commit': os.environ['SOURCE_DATA_COMMIT'],
              },
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({
              'version': 1, 'status': 'complete', 'stage': 'sealed_delivery',
              'strategy_evaluated': True, 'live_orders_enabled': False,
              'plaintext_published': False, 'sealed_parts': 1,
          }) + b'\n', 0o644)
          PY
      - name: Publish encrypted H465 journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Write redacted summary
        if: always()
        run: |
          echo '## H465 old-clean H453 strict cutoff' >> "$GITHUB_STEP_SUMMARY"
          echo '- No new market capture; H453 full-cash fraction is tested with a fixed 60-second early exit cutoff.' >> "$GITHUB_STEP_SUMMARY"
          echo '- H453 entry model, fee, slippage, release clock and one evolving ledger remain fixed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Detailed metrics remain in the encrypted research vault.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner-local plaintext
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'old-data-h465', Path('sealed-delivery')):
              if path.exists():
                  shutil.rmtree(path)
          PY
