name: H387 complete-set maker replay

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Finished public windows to replay"
        required: true
        default: "24"
      queue:
        description: "Shares ahead in the reconstructed queue"
        required: true
        default: "0,5,10"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: 0xbrutusdev/polymarket-5min-crypto-trading-bot
      SOURCE_COMMIT: accd1511a08748302c8116ab65575930e1240068
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local vault dependencies
        run: python -m pip install -r requirements-vault.txt
      - name: Run pinned public source replay
        id: replay
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/spork30-source"
          git clone --filter=blob:none "https://github.com/${SOURCE_REPOSITORY}.git" "$RUNNER_TEMP/spork30-source" >/dev/null 2>&1
          clone_status=$?
          if [ "$clone_status" -ne 0 ]; then
            python - "$RUNNER_TEMP/h387-report.json" "$clone_status" <<'PY'
            import json, sys
            from pathlib import Path
            Path(sys.argv[1]).write_text(json.dumps({
                "status": "source_unavailable",
                "stage": "clone",
                "exit_code": int(sys.argv[2]),
                "live_orders_enabled": False,
            }) + "\n")
            PY
            echo "source_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$RUNNER_TEMP/spork30-source" checkout --quiet "$SOURCE_COMMIT" >/dev/null 2>&1
          checkout_status=$?
          if [ "$checkout_status" -ne 0 ]; then
            python - "$RUNNER_TEMP/h387-report.json" "$checkout_status" <<'PY'
            import json, sys
            from pathlib import Path
            Path(sys.argv[1]).write_text(json.dumps({
                "status": "source_unavailable",
                "stage": "pin",
                "exit_code": int(sys.argv[2]),
                "live_orders_enabled": False,
            }) + "\n")
            PY
            echo "source_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The upstream default is 750 shares.  This bounded run fixes the
          # split to $5 and refuses to proceed if the source shape changes.
          python - "$RUNNER_TEMP/spork30-source/spork30/config.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          old = 'split_size: Decimal = Decimal("750")'
          new = 'split_size: Decimal = Decimal("5")'
          if text.count(old) != 1:
              raise SystemExit('unexpected_split_default')
          p.write_text(text.replace(old, new))
          PY
          if [ -f "$RUNNER_TEMP/spork30-source/requirements.txt" ]; then
            python -m pip install -r "$RUNNER_TEMP/spork30-source/requirements.txt" >/dev/null 2>&1
          fi
          mkdir -p "$RUNNER_TEMP/spork30-cache"
          (cd "$RUNNER_TEMP/spork30-source" && python -m spork30.backtest \
            --windows "${{ inputs.windows }}" \
            --queue "${{ inputs.queue }}" \
            --max-lean 3 --rebate-bps 0 --maker-fee-bps 0 \
            --cache "$RUNNER_TEMP/spork30-cache" \
            --json "$RUNNER_TEMP/h387-backtest.json" \
            > "$RUNNER_TEMP/h387-source.log" 2>&1)
          replay_status=$?
          if [ "$replay_status" -ne 0 ] || [ ! -s "$RUNNER_TEMP/h387-backtest.json" ]; then
            python - "$RUNNER_TEMP/h387-report.json" "$RUNNER_TEMP/h387-source.log" "$RUNNER_TEMP/h387-backtest.json" "$replay_status" <<'PY'
            import hashlib, json, sys
            from pathlib import Path
            report_path = Path(sys.argv[1])
            log_path = Path(sys.argv[2])
            backtest_path = Path(sys.argv[3])
            exit_code = int(sys.argv[4])
            log_bytes = log_path.read_bytes() if log_path.exists() else b""
            tail = log_bytes.decode("utf-8", "replace").splitlines()[-40:]
            report_path.write_text(json.dumps({
                "status": "source_replay_failed",
                "stage": "public_tape_replay",
                "exit_code": exit_code,
                "backtest_json_present": backtest_path.exists() and backtest_path.stat().st_size > 0,
                "source_log_sha256": hashlib.sha256(log_bytes).hexdigest(),
                "source_log_tail": tail,
                "live_orders_enabled": False,
            }) + "\n")
            PY
            echo "source_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python analysis/h387_maker_replay.py \
            --input "$RUNNER_TEMP/h387-backtest.json" \
            --output "$RUNNER_TEMP/h387-report.json" \
            --source-commit "$SOURCE_COMMIT"
          echo "source_ok=true" >> "$GITHUB_OUTPUT"
      - name: Seal report
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h387-report.json" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          report_path = Path(sys.argv[1])
          report_bytes = report_path.read_bytes()
          report = json.loads(report_bytes)
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          payload = {
              'format': 'h387-complete-set-maker-replay-sealed-v1',
              'report': report,
              'report_sha256': hashlib.sha256(report_bytes).hexdigest(),
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          status = {
              'version': 1,
              'status': 'complete',
              'stage': 'sealed_delivery',
              'strategy_evaluated': report.get('format') == 'h387-complete-set-maker-replay-v1',
              'live_orders_enabled': False,
              'plaintext_published': False,
              'sealed_parts': 1,
          }
          research_vault.write_new(delivery / 'status.json', research_vault.canonical(status) + b'\n', 0o644)
          PY
      - name: Publish encrypted journal
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Remove runner-local evidence
        if: always()
        run: rm -rf sealed-delivery "$RUNNER_TEMP/h387-report.json" "$RUNNER_TEMP/h387-backtest.json" "$RUNNER_TEMP/h387-source.log" "$RUNNER_TEMP/spork30-source" "$RUNNER_TEMP/spork30-cache"
