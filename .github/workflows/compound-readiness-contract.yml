name: compound-readiness-contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline execution test dependencies
        run: python -m pip install pytest numpy==2.4.6 scipy==1.17.1 pandas==3.1.0 scikit-learn==1.9.1 joblib==1.6.0 threadpoolctl==3.7.0
      - name: Frozen entry execution regression
        run: python -m pytest -q tests/test_offline_policy_audit.py tests/test_offline_paired_cost_audit.py tests/test_offline_entry_limit_audit.py tests/test_timed_quote_execution.py tests/test_offline_bid_residual_audit.py tests/test_side_conditioned_ridge.py tests/test_offline_side_interaction_audit.py tests/test_histogram_tree_artifact.py tests/test_offline_histogram_residual_audit.py tests/test_archived_quote_cash_domain_export.py
      - name: Cached quality-label and causal capacity regression
        run: python -m pytest -q tests/test_cached_quote_execution.py tests/test_offline_quality_capacity_audit.py
      - name: Paper adapter metadata and causal ledger regression
        run: python -m pytest -q tests/test_h508_h301_forward_adapter.py tests/test_causal_cash_ledger.py
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract test dependency
        run: python -m pip install pytest cryptography
      - name: Compound readiness contract smoke tests
        run: python -m unittest discover -s tests -p 'test_compound_readiness_contract.py' -v
      - name: Research and completed-evidence lifecycle regression
        run: python -m pytest -q tests/test_compound_readiness_report.py
      - name: Private offline audit workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_policy_workflow.py' -v
      - name: Private paired audit workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_paired_workflow.py' -v
      - name: Frozen entry-limit workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_entry_limit_workflow.py' -v
      - name: Private bid forecast workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_bid_residual_workflow.py' -v
      - name: Private side interaction workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_side_interaction_workflow.py' -v
      - name: Private histogram forecast workflow contract
        run: python -m unittest discover -s tests -p 'test_offline_histogram_residual_workflow.py' -v
      - name: Archived quote evidence export workflow contract
        run: python -m unittest discover -s tests -p 'test_archived_quote_cash_domain_workflow.py' -v
      - name: Scoped saved input and capability isolation contracts
        run: python -m pytest -q tests/test_scoped_research_dataset.py tests/test_verify_saved_research_input.py tests/test_scoped_saved_input_workflow.py
      - name: Dual saved input and cloud private-audit workflow contracts
        run: python -m pytest -q tests/test_quality_first_runner.py tests/test_restore_quality_capacity_inputs.py tests/test_seal_research_outcomes.py tests/test_offline_quality_capacity_workflow.py
      - name: Maker compound receipt contract smoke tests
        run: python -m unittest discover -s tests -p 'test_maker_compound_receipt_contract.py' -v
      - name: Maker compound bundle adapter smoke tests
        run: python -m unittest discover -s tests -p 'test_maker_compound_bundle_adapter.py' -v
      - name: Authenticated v2 compound bundle validator tests
        run: python -m unittest discover -s tests -p 'test_validate_authenticated_compound_bundle.py' -v
      - name: Authenticated taker compound bundle adapter tests
        run: python -m unittest discover -s tests -p 'test_taker_compound_bundle_adapter.py' -v
      - name: PolyBolt compound bundle settlement atomicity tests
        run: python -m pytest -q tests/test_validate_polybolt_compound_bundle.py
      - name: H578 compound bundle builder tests
        run: python -m unittest discover -s tests -p 'test_h578_compound_bundle_builder.py' -v
      - name: H600 compound bundle builder tests
        run: python -m unittest discover -s tests -p 'test_h600_compound_bundle_builder.py' -v
      - name: H534 compound bundle builder tests
        run: python -m unittest discover -s tests -p 'test_h534_compound_bundle_builder.py' -v
      - name: Continuous compound chain regression
        run: python -m pytest -q tests/test_sequential_compound_gate.py tests/test_run_polybolt_compound_admission.py
      - name: Compile readiness implementation
        run: python -m py_compile tools/compound_readiness_report.py analysis/orderfilled_compound_binding.py analysis/authenticated_compound_reconciler.py analysis/validate_authenticated_compound_bundle.py analysis/taker_compound_bundle_adapter.py analysis/h534_compound_bundle_builder.py analysis/h578_compound_bundle_builder.py analysis/h600_compound_bundle_builder.py analysis/maker_compound_receipt_contract.py analysis/maker_compound_bundle_adapter.py analysis/polymarket_receipt_adapter.py
