name: H462 H391 privacy-preserving identity sidecar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATASET_REVISION: f3bfb79f19611ea3115ad29c18720166ee6dd0b5
      DATASET_BASE: https://huggingface.co/datasets/krish301/polymarket-crypto-trades-v1/resolve/f3bfb79f19611ea3115ad29c18720166ee6dd0b5/data/raw/trades/btc/5m/05-03-2026
      SOURCE_COMMIT: accd1511a08748302c8116ab65575930e1240068
      WINDOW_START: 1772668800
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sidecar test dependency
        run: python -m pip install -r requirements-vault.txt pytest
      - name: Download the pinned H391 tape
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h462"
          mkdir -m 700 -p "$private_dir/fills"
          for minute in 00 05 10 15 20 25 30 35 40 45 50 55; do
            start=$((WINDOW_START + 300 * (10#$minute / 5)))
            curl --fail --location --retry 3 --max-time 180 \
              "$DATASET_BASE/00-${minute}-00-UTC/fills.jsonl.gz?download=true" \
              --output "$private_dir/fills/${start}.fills.jsonl.gz"
          done
      - name: Build deterministic redacted sidecar
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h462"
          python -m pytest -q tests/test_h462_h391_identity_sidecar.py
          python -u analysis/h462_h391_identity_sidecar.py \
            --fills-dir "$private_dir/fills" \
            --source-commit "$SOURCE_COMMIT" \
            --dataset-revision "$DATASET_REVISION" \
            --sidecar "$private_dir/identity-sidecar.jsonl.gz" \
            --report "$private_dir/report.json"
          python - "$private_dir/report.json" <<'PY'
          import json, sys
          report = json.loads(open(sys.argv[1], encoding='utf-8').read())
          print(json.dumps({'rows': report.get('rows', {}), 'sidecar': report.get('sidecar', {})}, sort_keys=True))
          PY
      - name: Seal sidecar and aggregate report
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h462" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          encoded = os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64', '')
          recipient_id = os.environ.get('QUALITY_FIRST_RECIPIENT_ID', '')
          if not encoded or not recipient_id:
              raise SystemExit('recipient_unavailable')
          recipient = research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          report = json.loads((private / 'report.json').read_text(encoding='utf-8'))
          sidecar = base64.b64encode((private / 'identity-sidecar.jsonl.gz').read_bytes()).decode('ascii')
          payload = {
              'format': 'h462-h391-identity-sidecar-sealed-v1',
              'report': report,
              'sidecar_encoding': 'base64-gzip-jsonl',
              'sidecar_b64': sidecar,
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'head_sha': os.environ['GITHUB_SHA']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': 'complete', 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H462 H391 privacy-preserving identity sidecar' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/h462/report.json" ]; then
            python - "$RUNNER_TEMP/h462/report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.loads(open(sys.argv[1], encoding='utf-8').read())
          rows, sidecar = report.get('rows', {}), report.get('sidecar', {})
          print(f"- Fixed H391 rows: total={rows.get('total', 0)}, complete identity rows={rows.get('complete_identity_rows', 0)}.")
          print(f"- Deterministic encrypted sidecar: rows={sidecar.get('rows', 0)}, bytes={sidecar.get('compressed_bytes', 0)}, sha256={sidecar.get('sha256', '')}.")
          print('- Identity/hash/asset values are sealed as domain-separated digests; no raw values are printed.')
          PY
          fi
          echo '- No strategy replay, model refit, new market period or order was performed.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h462', Path('sealed-delivery')):
              if path.exists(): shutil.rmtree(path)
          PY
