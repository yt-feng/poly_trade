name: H321 accounting snapshot source probe

on:
  workflow_dispatch:
    inputs:
      data_api_base_url:
        description: Official Polymarket Data API base URL
        required: false
        default: https://data-api.polymarket.com
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install vault and current official SDK
        run: |
          set -euo pipefail
          python -m pip install -r requirements-vault.txt
          sdk_commit="$(git ls-remote https://github.com/Polymarket/py-sdk.git refs/heads/main | cut -f1)"
          test "${#sdk_commit}" -eq 40
          echo "POLY_SDK_COMMIT=$sdk_commit" >> "$GITHUB_ENV"
          python -m pip install "git+https://github.com/Polymarket/py-sdk.git@$sdk_commit"

      - name: Capture existing accounts and probe accounting snapshots
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          BTC5M_POLYMARKET_PRIVATE_KEY: ${{ secrets.BTC5M_POLYMARKET_PRIVATE_KEY }}
          DATA_API_BASE_URL: ${{ inputs.data_api_base_url }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h321"
          mkdir -m 700 "$private_dir"
          python - "$private_dir/keys.json" <<'PY'
          import json, os, sys
          rows=[]
          for label, env_name in (("polymarket", "POLYMARKET_PRIVATE_KEY"), ("btc5m", "BTC5M_POLYMARKET_PRIVATE_KEY")):
              value=os.environ.get(env_name, "").strip()
              if value:
                  rows.append({"label": label, "private_key": value})
          with open(sys.argv[1], "w") as handle:
              json.dump(rows, handle, separators=(",", ":"))
          PY
          set +e
          python -u analysis/h279_authenticated_lifecycle_capture.py \
            --keys-file "$private_dir/keys.json" \
            --sdk-commit "$POLY_SDK_COMMIT" \
            --output "$private_dir/h279.json" \
            > "$private_dir/h279.stdout" 2> "$private_dir/h279.stderr"
          h279_rc=$?
          set -e
          python - "$private_dir/h279.json" "$private_dir/h321-input.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          source=Path(sys.argv[1]); target=Path(sys.argv[2])
          report=json.loads(source.read_text()) if source.exists() else {}
          address=re.compile(r'^0x[0-9a-fA-F]{40}$')
          accounts=[]
          for row in report.get('accounts') or []:
              if not isinstance(row, dict):
                  continue
              counts={}
              for trade in row.get('account_trades') or []:
                  if not isinstance(trade, dict):
                      continue
                  for key in ('maker_address','owner_address','wallet_address','proxy_wallet'):
                      value=str(trade.get(key) or '').strip().lower()
                      if address.fullmatch(value):
                          counts[value]=counts.get(value,0)+1
                          break
              if counts:
                  owner=max(counts.items(), key=lambda item:(item[1],item[0]))[0]
                  accounts.append({'label':row.get('label',''),'owner':owner})
          target.write_text(json.dumps(accounts, separators=(',',':')))
          PY
          set +e
          python -u analysis/h321_accounting_snapshot_probe.py \
            --input "$private_dir/h321-input.json" \
            --output "$private_dir/h321.json" \
            --base-url "$DATA_API_BASE_URL" \
            > "$private_dir/h321.stdout" 2> "$private_dir/h321.stderr"
          h321_rc=$?
          set -e
          export H279_RC="$h279_rc" H321_RC="$h321_rc"
          python - "$private_dir" <<'PY'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private=Path(sys.argv[1])
          encoded=os.environ.get('QUALITY_FIRST_RECIPIENT_JSON_B64','')
          recipient_id=os.environ.get('QUALITY_FIRST_RECIPIENT_ID','')
          if not encoded or not recipient_id:
              raise SystemExit('recipient unavailable')
          recipient=research_vault.load_json_bytes(base64.b64decode(encoded, validate=True), 4096)
          research_vault.validate_recipient(recipient, recipient_id)
          h279=json.loads((private/'h279.json').read_text()) if (private/'h279.json').exists() else {}
          h321=json.loads((private/'h321.json').read_text()) if (private/'h321.json').exists() else {}
          payload={
              'format':'h321-accounting-snapshot-probe-sealed-v1',
              'sdk_commit':os.environ['POLY_SDK_COMMIT'],
              'h279':h279,
              'h321':h321,
              'workflow':{
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'ref':os.environ['GITHUB_REF'],
                  'data_api_base_url_sha256':hashlib.sha256(os.environ.get('DATA_API_BASE_URL','').encode()).hexdigest(),
              },
              'new_strategy_data_collected':False,
              'model_refit':False,
              'live_orders_enabled':False,
              'actual_fills':0,
              'verified_canary_fills':0,
              'same_ledger_compounding_rows':0,
          }
          delivery=Path('sealed-delivery'); delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery/'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          complete=int(os.environ.get('H279_RC','1')) == 0 and int(os.environ.get('H321_RC','1')) == 0
          status={'version':1,'status':'complete' if complete else 'failed','stage':'sealed_delivery',
                  'strategy_evaluated':False,'live_orders_enabled':False,'plaintext_published':False,'sealed_parts':1}
          if not complete:
              status['failed_stage']='research'
          research_vault.write_new(delivery/'status.json', research_vault.canonical(status)+b'\n', 0o644)
          PY

      - name: Publish only encrypted accounting snapshot probe
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"

      - name: Redacted summary and cleanup
        if: always()
        run: |
          echo '## H321 accounting snapshot source probe' >> "$GITHUB_STEP_SUMMARY"
          echo '- Read-only probe of the official `/v1/accounting/snapshot?user=` source; no order, redeem, merge, transfer or allowance mutation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Owner identities, response bodies, transaction details and row values remain encrypted; the public summary reports no empirical strategy result.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          private=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'h321'
          if private.exists(): shutil.rmtree(private)
          if Path('sealed-delivery').exists(): shutil.rmtree('sealed-delivery')
          PY
