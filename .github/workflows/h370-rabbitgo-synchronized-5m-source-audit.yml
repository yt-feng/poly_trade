name: H370 synchronized BTC 5m source audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATASET_BASE: https://huggingface.co/datasets/RabbitGo777/polymarket.btc.5m_20260807T1100.v4.parquet/resolve/main
    steps:
      - name: Checkout poly_trade
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded audit dependencies
        run: python -m pip install pandas pyarrow cryptography
      - name: Download fixed public sample
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h370"
          mkdir -m 700 "$private_dir"
          for name in polymarket.btc.5m_20260807T1100.v4.parquet binance.btc_20260807T1100.v4.parquet chainlink.btc_20260807T1100.v4.parquet; do
            curl --fail --location --retry 3 --max-time 600 "$DATASET_BASE/$name" --output "$private_dir/$name"
          done
      - name: Run source contract audit
        id: source_audit
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/h370"
          python -u analysis/h370_rabbitgo_synchronized_5m_source_audit.py \
            --input-dir "$private_dir" \
            --output "$private_dir/results" \
            > "$private_dir/analysis-output.txt" 2>&1
      - name: Seal H370 results
        id: seal_h370
        if: always()
        env:
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/h370" <<'PY'
          import base64, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import research_vault
          private = Path(sys.argv[1])
          recipient = research_vault.load_json_bytes(base64.b64decode(os.environ['QUALITY_FIRST_RECIPIENT_JSON_B64'], validate=True), 4096)
          recipient_id = os.environ['QUALITY_FIRST_RECIPIENT_ID']
          research_vault.validate_recipient(recipient, recipient_id)
          report_path = private / 'results' / 'report.json'
          report = json.loads(report_path.read_text()) if report_path.exists() else None
          analysis_output_path = private / 'analysis-output.txt'
          payload = {
              'format': 'h370-rabbitgo-synchronized-5m-source-audit-sealed-v1',
              'status': 'complete' if report is not None else 'failed',
              'report': report,
              'analysis_output': analysis_output_path.read_text() if analysis_output_path.exists() else '',
              'workflow': {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'ref': os.environ['GITHUB_REF']},
          }
          delivery = Path('sealed-delivery')
          delivery.mkdir(mode=0o700)
          research_vault.write_new(delivery / 'part-0000.vault', research_vault.seal(research_vault.canonical(payload), recipient, recipient_id), 0o600)
          research_vault.write_new(delivery / 'status.json', research_vault.canonical({'version': 1, 'status': payload['status'], 'stage': 'sealed_delivery', 'strategy_evaluated': False, 'live_orders_enabled': False, 'plaintext_published': False, 'sealed_parts': 1}) + b'\n', 0o644)
          PY
      - name: Publish encrypted H370 journal
        if: always() && steps.seal_h370.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/publish_quality_first_journal.py \
            --source sealed-delivery \
            --repository yt-feng/poly_trade \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --recipient-id "$RESEARCH_RECIPIENT_ID"
      - name: Redacted completion and cleanup
        if: always()
        run: |
          set -euo pipefail
          echo '## H370 synchronized BTC 5m source audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Audited a fixed public one-hour sample for causal timestamp and field availability; no strategy or Canary result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'h370', Path('sealed-delivery')):
              if path.exists():
                  shutil.rmtree(path)
          PY
