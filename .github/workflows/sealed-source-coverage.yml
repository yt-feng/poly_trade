name: sealed-source-coverage
on:
  pull_request:
    paths:
      - '.github/workflows/sealed-source-coverage.yml'
      - '.github/workflows/sealed-journal-persist.yml'
      - 'analysis/polybolt_twap_adapter.py'
      - 'analysis/validate_polybolt_compound_bundle.py'
      - 'tools/run_source_coverage.py'
      - 'analysis/settlement_source_coverage.py'
      - 'analysis/forward_acquire.py'
      - 'tools/run_quality_first_research.py'
      - 'tools/research_vault.py'
      - 'tests/test_polybolt_twap_adapter.py'
      - 'tests/test_validate_polybolt_compound_bundle.py'
      - 'tests/test_source_coverage_runner.py'
      - 'tests/test_settlement_source_coverage.py'
      - 'requirements-vault.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sealed-source-coverage.yml'
      - 'analysis/polybolt_twap_adapter.py'
      - 'analysis/validate_polybolt_compound_bundle.py'
      - 'analysis/settlement_source_coverage.py'
      - 'tests/test_polybolt_twap_adapter.py'
      - 'tests/test_validate_polybolt_compound_bundle.py'
      - 'tests/test_settlement_source_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sealed-source-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt pytest
      - name: Synthetic coverage and sealed-delivery contracts
        run: |
          python -m unittest discover -s tests -p 'test_polybolt_twap_adapter.py' -v
          python -m pytest -q tests/test_validate_polybolt_compound_bundle.py
          python -m unittest discover -s tests -p 'test_settlement_source_coverage.py' -v
          python -m unittest discover -s tests -p 'test_source_coverage_runner.py' -v
          python -m unittest discover -s tests -p 'test_persist_quality_first_journal.py' -v
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-vault.txt
      - name: Registered public-source audit with ciphertext-only delivery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COVERAGE_REQUEST_B64: ${{ secrets.SOURCE_COVERAGE_REQUEST_B64 }}
          QUALITY_FIRST_RECIPIENT_JSON_B64: ${{ vars.QUALITY_FIRST_RECIPIENT_JSON_B64 }}
          QUALITY_FIRST_RECIPIENT_ID: ${{ vars.QUALITY_FIRST_RECIPIENT_ID }}
        run: |
          ulimit -v 3145728
          python -u tools/run_source_coverage.py --output sealed-delivery
      - name: Deliver ciphertext and generic operational status only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-first-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sealed-delivery/*.vault
            sealed-delivery/status.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
